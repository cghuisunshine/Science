<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acids and Bases Quiz</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #15803d;
      --success-soft: #dcfce7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #f4f7fb 100%);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      width: min(920px, calc(100% - 24px));
      margin: 24px auto 56px;
    }

    .hero {
      background: linear-gradient(135deg, #eff6ff, #ffffff 58%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 68ch;
    }

    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229,231,235,0.9);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 20px;
    }

    .status {
      display: grid;
      gap: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      font-size: 0.95rem;
    }

    .bar {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      transition: width 0.25s ease;
      border-radius: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22); }
    .secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }

    .results {
      display: none;
      margin-bottom: 18px;
      padding: 18px 20px;
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .results.show { display: block; }
    .results h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .results p { margin: 0; color: var(--muted); }

    .quiz {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .q-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .q-num {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .q-text {
      margin: 3px 0 0;
      font-size: 1.06rem;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfdff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .option:hover {
      border-color: #bfdbfe;
      background: #f8fbff;
      transform: translateY(-1px);
    }

    .option input { margin: 0; transform: scale(1.05); }
    .option.correct {
      background: var(--success-soft);
      border-color: #86efac;
    }
    .option.incorrect {
      background: var(--danger-soft);
      border-color: #fca5a5;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.correct {
      background: var(--success-soft);
      color: var(--success);
    }
    .feedback.incorrect {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .feedback.neutral {
      background: #f3f4f6;
      color: #374151;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 16px, 920px); margin-top: 16px; }
      .hero { padding: 20px; border-radius: 22px; }
      .toolbar {
        grid-template-columns: 1fr;
        top: 8px;
      }
      .actions { justify-content: stretch; }
      .actions button { flex: 1 1 100%; }
      .card { padding: 16px; }
      .q-text { font-size: 1rem; }
      .option { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">Chemistry Quiz</div>
      <h1>Acids and Bases</h1>
      <p>Test your understanding of acids, bases, pH, hydrogen ions, and common chemical properties. Choose one answer for each question, then score your quiz and review the correct answers.</p>
    </section>

    <section class="toolbar" aria-label="Quiz controls">
      <div class="status">
        <div class="status-row">
          <strong id="answeredCount">0 / 10 answered</strong>
          <span id="liveScore">Score: —</span>
        </div>
        <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
      <div class="actions">
        <button class="secondary" id="resetBtn" type="button">Reset</button>
        <button class="primary" id="checkBtn" type="button">Check Answers</button>
      </div>
    </section>

    <section class="results" id="resultsBox" aria-live="polite">
      <h2 id="scoreHeadline">Your score</h2>
      <p id="scoreText"></p>
    </section>

    <form class="quiz" id="quizForm"></form>

    <p class="footer-note">Standalone practice page for study use.</p>
  </div>

  <script>
    const quizData = [
      {
        question: 'A hydrogen ion, H+, is the same as a(n):',
        options: ['neutron', 'electron', 'proton', 'hydroxide ion'],
        answer: 'proton'
      },
      {
        question: 'Acidic foods can be identified by what taste?',
        options: ['salty', 'sour', 'bitter', 'sweet'],
        answer: 'sour'
      },
      {
        question: 'OH− is called the:',
        options: ['hydrate ion', 'hydrogen ion', 'hydronium ion', 'hydroxide ion'],
        answer: 'hydroxide ion'
      },
      {
        question: 'Acids increase the concentration of what in water?',
        options: ['H+ ions', 'hydrate ions', 'hydroxide ions', 'OH− ions'],
        answer: 'H+ ions'
      },
      {
        question: 'A beaker full of acid is added to a beaker full of base. The pH of the base will:',
        options: ['change constantly', 'decrease', 'increase', 'stay the same'],
        answer: 'decrease'
      },
      {
        question: 'A solution with a pH of 11 has a H+ concentration of:',
        options: ['1 × 10^-11 moles/liter', '1 × 10^-3 moles/liter', '1 × 10^11 moles/liter', '1 × 10^3 moles/liter'],
        answer: '1 × 10^-11 moles/liter'
      },
      {
        question: 'Which substance has the lowest pH?',
        options: ['milk', 'NaOH', 'pure water', 'lemon juice'],
        answer: 'lemon juice'
      },
      {
        question: 'An unknown substance is added to a solution and the pH increases. The substance is:',
        options: ['acidic', 'basic', 'solvent', 'sweet'],
        answer: 'basic'
      },
      {
        question: 'What is the concentration of H+ in pure water?',
        options: ['1 × 10^-13 moles/liter', '1 × 10^-14 moles/liter', '1 × 10^-7 moles/liter', '1 × 10^7 moles/liter'],
        answer: '1 × 10^-7 moles/liter'
      },
      {
        question: 'Bases can be referred to as:',
        options: ['none of the choices', 'proton acceptors', 'proton donors', 'protons'],
        answer: 'proton acceptors'
      }
    ];

    const quizForm = document.getElementById('quizForm');
    const progressBar = document.getElementById('progressBar');
    const answeredCount = document.getElementById('answeredCount');
    const liveScore = document.getElementById('liveScore');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultsBox = document.getElementById('resultsBox');
    const scoreHeadline = document.getElementById('scoreHeadline');
    const scoreText = document.getElementById('scoreText');

    function renderQuiz() {
      quizForm.innerHTML = quizData.map((item, index) => `
        <article class="card" data-index="${index}">
          <div class="q-top">
            <div class="q-num">${index + 1}</div>
            <p class="q-text">${item.question}</p>
          </div>
          <div class="options" role="radiogroup" aria-label="Question ${index + 1}">
            ${item.options.map((option, optIndex) => `
              <label class="option">
                <input type="radio" name="q${index}" value="${escapeHtml(option)}" aria-label="${escapeHtml(option)}" />
                <span>${escapeHtml(option)}</span>
              </label>
            `).join('')}
          </div>
          <div class="feedback" id="feedback-${index}"></div>
        </article>
      `).join('');

      quizForm.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', updateProgress);
      });

      updateProgress();
    }

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function updateProgress() {
      let answered = 0;
      quizData.forEach((_, index) => {
        if (quizForm.querySelector(`input[name="q${index}"]:checked`)) answered++;
      });
      const pct = (answered / quizData.length) * 100;
      answeredCount.textContent = `${answered} / ${quizData.length} answered`;
      progressBar.style.width = `${pct}%`;
    }

    function checkAnswers() {
      let score = 0;

      quizData.forEach((item, index) => {
        const selected = quizForm.querySelector(`input[name="q${index}"]:checked`);
        const feedback = document.getElementById(`feedback-${index}`);
        const card = quizForm.querySelector(`.card[data-index="${index}"]`);
        const labels = card.querySelectorAll('.option');

        labels.forEach(label => label.classList.remove('correct', 'incorrect'));
        feedback.className = 'feedback show';

        labels.forEach(label => {
          const input = label.querySelector('input');
          if (input.value === item.answer) label.classList.add('correct');
        });

        if (!selected) {
          feedback.classList.add('neutral');
          feedback.innerHTML = `No answer selected. Correct answer: <strong>${item.answer}</strong>`;
          return;
        }

        if (selected.value === item.answer) {
          score++;
          feedback.classList.add('correct');
          feedback.innerHTML = `Correct.`;
        } else {
          selected.closest('.option').classList.add('incorrect');
          feedback.classList.add('incorrect');
          feedback.innerHTML = `Your answer: <strong>${selected.value}</strong>. Correct answer: <strong>${item.answer}</strong>`;
        }
      });

      const percent = Math.round((score / quizData.length) * 100);
      liveScore.textContent = `Score: ${score}/${quizData.length}`;
      scoreHeadline.textContent = `Your score: ${score} / ${quizData.length}`;
      scoreText.textContent = `That is ${percent}%. Review the highlighted answers below.`;
      resultsBox.classList.add('show');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetQuiz() {
      quizForm.reset();
      quizForm.querySelectorAll('.option').forEach(el => el.classList.remove('correct', 'incorrect'));
      quizForm.querySelectorAll('.feedback').forEach(el => {
        el.className = 'feedback';
        el.textContent = '';
      });
      resultsBox.classList.remove('show');
      liveScore.textContent = 'Score: —';
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    checkBtn.addEventListener('click', checkAnswers);
    resetBtn.addEventListener('click', resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
