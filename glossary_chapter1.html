<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glossary — Chapter 1 (BC Science 10)</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#0f1733;
      --ink:#e9eefc;
      --muted:#b9c2e6;
      --line:rgba(255,255,255,.10);
      --accent:#7aa2ff;
      --accent2:#7ef0c2;
      --warn:#ffdd7a;
      --danger:#ff7a7a;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --radius:16px;
      --max: 1080px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--ink);
      background: radial-gradient(1200px 600px at 10% 0%, rgba(122,162,255,.18), transparent 60%),
                  radial-gradient(900px 600px at 90% 10%, rgba(126,240,194,.14), transparent 55%),
                  var(--bg);
      line-height:1.55;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,16,32,.92), rgba(11,16,32,.65));
      border-bottom:1px solid var(--line);
    }
    .topbar{
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 16px;
      display:flex; gap:12px; align-items:center; justify-content:space-between;
    }
    .brand{display:flex; flex-direction:column; gap:2px;}
    .kicker{font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase;}
    h1{margin:0; font-size:16px; font-weight:700;}
    main{max-width: var(--max); margin: 0 auto; padding: 18px 16px 70px;}
    .panel{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      padding: 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    .panel-body{padding: 14px;}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .grow{flex:1 1 auto;}
    .input{
      width: 100%;
      min-width: 260px;
      padding: 10px 12px;
      border:1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: var(--ink);
      font-size: 14px;
    }
    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding: 9px 11px;
      border:1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: var(--ink);
      font-size: 13px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,.07); }
    .btn code{font-family:var(--mono); font-size:12px; color:var(--muted)}
    .small{font-size: 12px; color: var(--muted);}
    .warn{color: var(--warn);}
    .danger{color: var(--danger);}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 3px 8px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    details.term{
      border:1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      overflow:hidden;
    }
    details.term[open]{
      box-shadow: 0 12px 34px rgba(0,0,0,.35);
    }
    details.term > summary{
      list-style:none;
      padding: 12px 12px;
      cursor:pointer;
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
    }
    details.term > summary::-webkit-details-marker{display:none}
    .term-left{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
      flex: 1 1 auto;
    }
    .term-title{
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
      display:flex;
      gap: 10px;
      align-items:baseline;
      flex-wrap:wrap;
      min-width:0;
    }
    .term-title span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .term-title code{
      font-family:var(--mono);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .term-preview{
      font-size: 12px;
      color: var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .term-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
    .term-body{
      padding: 0 12px 12px;
      border-top:1px solid var(--line);
    }
    .term-section{
      margin-top: 10px;
      border:1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.02);
      overflow:hidden;
    }
    .term-section > summary::-webkit-details-marker{display:none}
    .term-section h3{
      margin:0;
      padding: 10px 10px 8px;
      border-bottom:1px solid var(--line);
      font-size: 12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color: var(--muted);
    }
    .term-section .content{
      padding: 10px;
      font-size: 13px;
    }
    .md hr{
      border:none;
      border-top: 1px solid var(--line);
      margin: 10px 0;
    }
    .md h2,.md h3,.md h4{
      margin: 10px 0 6px;
      line-height: 1.25;
    }
    .md h2{font-size: 15px;}
    .md h3{font-size: 14px; color: var(--accent2);}
    .md h4{font-size: 13px; color: var(--ink);}
    .md p{margin: 0 0 8px;}
    .md ul,.md ol{margin: 0 0 8px 18px; padding:0;}
    .md li{margin: 2px 0;}
    .md code{
      font-family: var(--mono);
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
    }
    .occ{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding: 8px 10px;
      border-top:1px solid var(--line);
    }
    .occ:first-child{border-top:none}
    .occ a{font-family:var(--mono); font-size: 12px;}
    .snippet{color: var(--muted); font-size: 13px;}
    mark{
      background: rgba(126,240,194,.20);
      border:1px solid rgba(126,240,194,.25);
      color: var(--ink);
      padding: 0 3px;
      border-radius: 6px;
    }
    img.note-img{
      display:block;
      max-width: 100%;
      border-radius: 12px;
      border:1px solid var(--line);
      margin: 8px 0;
      background: rgba(255,255,255,.02);
    }
    .footer{
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="kicker">Science 10 • Chapter 1</div>
        <h1>Glossary Browser</h1>
      </div>
      <div class="row">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="assets/BC_Science10-Ch01.pdf" target="_blank" rel="noopener">Open PDF</a>
      </div>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-head">
        <div class="grow">
          <input id="q" class="input" type="search" placeholder="Search terms (e.g., mutualism, niche, canopy)..." autocomplete="off" />
          <div id="status" class="small" style="margin-top:6px;"></div>
        </div>
        <button id="btnReload" class="btn" type="button">Reload JSON</button>
        <label class="btn" for="fileInput" style="cursor:pointer;">
          Load JSON file
          <input id="fileInput" type="file" accept=".json,application/json" style="display:none;" />
        </label>
        <button id="btnBack" class="btn" type="button" style="display:none;">Back</button>
      </div>
      <div class="panel-body">
        <div id="help" class="small"></div>
        <div id="viewList" style="margin-top:12px;">
          <div id="results" class="grid"></div>
        </div>
        <div id="viewTerm" style="margin-top:12px; display:none;"></div>
        <div class="footer">
          Source file: <code>2026-01-03-BC_Science10-Ch01.pdf-Public.json</code>
        </div>
      </div>
    </div>
  </main>

  <script>
    const DEFAULT_JSON_PATH = "2026-01-03-BC_Science10-Ch01.pdf-Public.json";
    const FALLBACK_PDF_PATH = "assets/BC_Science10-Ch01.pdf";

    const elQ = document.getElementById("q");
    const elStatus = document.getElementById("status");
    const elHelp = document.getElementById("help");
    const elResults = document.getElementById("results");
    const elViewList = document.getElementById("viewList");
    const elViewTerm = document.getElementById("viewTerm");
    const elFileInput = document.getElementById("fileInput");
    const elBtnBack = document.getElementById("btnBack");

    let grouped = [];
    const groupedByKey = new Map();
    let pdfUrlGlobal = null;

    elHelp.innerHTML = `
      <div class="small">
        If you see no terms, click <span class="warn">Load JSON file</span> and select
        <code>${DEFAULT_JSON_PATH}</code>.
        (Auto-load works when served via <code>http://</code>.)
      </div>
    `;
    setStatus(`<span class="badge">Waiting to load…</span>`);

    window.addEventListener("error", (e) => {
      const msg = e && e.message ? String(e.message) : "Unknown error";
      elHelp.insertAdjacentHTML("beforeend", `<div class="small danger" style="margin-top:8px;">JS error: ${escapeHtml(msg)}</div>`);
    });
    window.addEventListener("unhandledrejection", (e) => {
      const msg = e && e.reason ? String(e.reason) : "Unhandled promise rejection";
      elHelp.insertAdjacentHTML("beforeend", `<div class="small danger" style="margin-top:8px;">${escapeHtml(msg)}</div>`);
    });

    function setStatus(html) {
      elStatus.innerHTML = html;
    }

    function escapeHtml(s) {
      return (s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c]));
    }

    function normalizeSpace(s) {
      return (s ?? "").replace(/\s+/g, " ").trim();
    }

    function clampText(s, maxLen) {
      const t = normalizeSpace(s);
      if (t.length <= maxLen) return t;
      return t.slice(0, Math.max(0, maxLen - 1)) + "…";
    }

    function inlinePreprocess(text) {
      // Support a tiny allowlist of inline HTML by converting it to Markdown-ish markers first.
      return String(text || "")
        .replace(/<\s*br\s*\/?\s*>/gi, "\n")
        .replace(/<\s*\/\s*(strong|b)\s*>/gi, "**")
        .replace(/<\s*(strong|b)\s*>/gi, "**")
        .replace(/<\s*\/\s*(em|i)\s*>/gi, "*")
        .replace(/<\s*(em|i)\s*>/gi, "*");
    }

    function appendInline(parent, text) {
      let s = inlinePreprocess(text);
      while (s) {
        const patterns = [
          { type: "code", re: /`([^`]+?)`/ },
          { type: "link", re: /\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/ },
          { type: "bold", re: /\*\*([^*]+?)\*\*/ },
          { type: "italic", re: /\*([^*]+?)\*/ },
        ];

        let best = null;
        for (const p of patterns) {
          const m = s.match(p.re);
          if (!m) continue;
          const idx = s.indexOf(m[0]);
          if (best === null || idx < best.idx) best = { p, m, idx };
        }

        if (!best) {
          parent.appendChild(document.createTextNode(s));
          break;
        }

        if (best.idx > 0) {
          parent.appendChild(document.createTextNode(s.slice(0, best.idx)));
        }

        const { type } = best.p;
        const m = best.m;

        if (type === "code") {
          const code = document.createElement("code");
          code.textContent = m[1];
          parent.appendChild(code);
        } else if (type === "link") {
          const a = document.createElement("a");
          a.href = m[2];
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = m[1];
          parent.appendChild(a);
        } else if (type === "bold") {
          const strong = document.createElement("strong");
          strong.textContent = m[1];
          parent.appendChild(strong);
        } else if (type === "italic") {
          const em = document.createElement("em");
          em.textContent = m[1];
          parent.appendChild(em);
        }

        s = s.slice(best.idx + m[0].length);
      }
    }

    function previewFromMarkdown(md) {
      const raw = (md || "").trim();
      if (!raw) return "";
      const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      for (const line of lines) {
        if (/^!\[.*?\]\((https?:\/\/[^\s)]+)\)$/.test(line)) continue;
        if (/^---+$/.test(line)) continue;
        let s = line;
        s = s.replace(/^(#{1,6})\s+/, "");
        s = s.replace(/^(\*|-)\s+/, "");
        s = s.replace(/^\d+\.\s+/, "");
        s = s.replace(/\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/g, "$1");
        s = s.replace(/[`*_]/g, "");
        s = normalizeSpace(s);
        if (s) return clampText(s, 140);
      }
      return "";
    }

    function noteImageUrls(md) {
      const raw = (md || "");
      const out = [];
      const re = /!\[[^\]]*?\]\((https?:\/\/[^\s)]+)\)/g;
      let m;
      while ((m = re.exec(raw))) out.push(m[1]);
      return out;
    }

    function selectorOfType(selectors, type) {
      return (selectors || []).find((s) => s && s.type === type) || null;
    }

    function extractAnnotation(a) {
      const target = (a && a.target && a.target[0]) || {};
      const selectors = target.selector || [];
      const quote = selectorOfType(selectors, "TextQuoteSelector");
      const page = selectorOfType(selectors, "PageSelector");

      const term = normalizeSpace(quote && quote.exact);
      if (!term) return null;

      const noteRaw = (a && typeof a.text === "string") ? a.text.replace(/\r\n/g, "\n").trim() : "";

      return {
        term,
        termKey: term.toLowerCase(),
        prefix: quote && quote.prefix ? quote.prefix : "",
        suffix: quote && quote.suffix ? quote.suffix : "",
        pageIndex: page && Number.isFinite(page.index) ? page.index : null,
        pageLabel: page && page.label ? String(page.label) : null,
        note: noteRaw,
        uri: a && a.uri ? String(a.uri) : null,
        source: target && target.source ? String(target.source) : null,
      };
    }

    function buildSnippet(prefix, term, suffix) {
      const pre = normalizeSpace(prefix);
      const suf = normalizeSpace(suffix);
      const preTail = pre.length > 44 ? "…" + pre.slice(-44) : pre;
      const sufHead = suf.length > 44 ? suf.slice(0, 44) + "…" : suf;
      const left = preTail ? escapeHtml(preTail) + " " : "";
      const right = sufHead ? " " + escapeHtml(sufHead) : "";
      return `${left}<mark>${escapeHtml(term)}</mark>${right}`;
    }

    function renderMarkdownish(container, md) {
      container.textContent = "";
      container.classList.add("md");
      const raw = (md || "").trim();
      if (!raw) return;

      const lines = raw.split(/\r?\n/);
      let i = 0;

      function addImage(alt, url) {
        const img = document.createElement("img");
        img.className = "note-img";
        img.alt = alt || "Image";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.src = url;
        container.appendChild(img);
      }

      while (i < lines.length) {
        const lineRaw = lines[i];
        const line = (lineRaw || "").trim();
        if (!line) { i++; continue; }

        if (/^---+$/.test(line)) {
          container.appendChild(document.createElement("hr"));
          i++;
          continue;
        }

        const imgMatch = line.match(/^!\[(.*?)\]\((https?:\/\/[^\s)]+)\)$/);
        if (imgMatch) {
          addImage(imgMatch[1], imgMatch[2]);
          i++;
          continue;
        }

        const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          const level = Math.min(4, Math.max(2, headingMatch[1].length));
          const h = document.createElement("h" + level);
          appendInline(h, headingMatch[2]);
          container.appendChild(h);
          i++;
          continue;
        }

        const ulMatch = line.match(/^(\*|-)\s+(.*)$/);
        if (ulMatch) {
          const ul = document.createElement("ul");
          while (i < lines.length) {
            const l = (lines[i] || "").trim();
            const m = l.match(/^(\*|-)\s+(.*)$/);
            if (!m) break;
            const li = document.createElement("li");
            appendInline(li, m[2]);
            ul.appendChild(li);
            i++;
          }
          container.appendChild(ul);
          continue;
        }

        const olMatch = line.match(/^(\d+)\.\s+(.*)$/);
        if (olMatch) {
          const ol = document.createElement("ol");
          while (i < lines.length) {
            const l = (lines[i] || "").trim();
            const m = l.match(/^(\d+)\.\s+(.*)$/);
            if (!m) break;
            const li = document.createElement("li");
            appendInline(li, m[2]);
            ol.appendChild(li);
            i++;
          }
          container.appendChild(ol);
          continue;
        }

        // paragraph: join consecutive non-special lines
        const parts = [];
        while (i < lines.length) {
          const l = (lines[i] || "");
          const t = l.trim();
          if (!t) break;
          if (/^---+$/.test(t)) break;
          if (/^!\[.*?\]\((https?:\/\/[^\s)]+)\)$/.test(t)) break;
          if (/^(#{1,6})\s+/.test(t)) break;
          if (/^(\*|-)\s+/.test(t)) break;
          if (/^\d+\.\s+/.test(t)) break;
          parts.push(t);
          i++;
        }
        const p = document.createElement("p");
        appendInline(p, parts.join(" "));
        container.appendChild(p);
      }
    }

    function linkToPdf(pdfUrl, pageLabel, pageIndex) {
      const base = pdfUrl || FALLBACK_PDF_PATH;
      const page = pageLabel && /^\d+$/.test(pageLabel) ? Number(pageLabel) : (Number.isFinite(pageIndex) ? pageIndex + 1 : null);
      if (!page) return base;
      return `${base}#page=${page}`;
    }

    function groupAnnotations(annotations) {
      const map = new Map();
      let pdfUrl = null;

      for (const a of annotations) {
        const ex = extractAnnotation(a);
        if (!ex) continue;
        if (!pdfUrl && ex.source) pdfUrl = ex.source;

        const key = ex.termKey;
        if (!map.has(key)) {
          map.set(key, {
            term: ex.term,
            key,
            pdfUrl,
            occurrences: [],
            notes: new Set(),
            pages: new Set(),
            searchText: "",
          });
        }
        const g = map.get(key);
        if (!g.pdfUrl && pdfUrl) g.pdfUrl = pdfUrl;

        const occ = {
          pageLabel: ex.pageLabel,
          pageIndex: ex.pageIndex,
          uri: ex.uri,
          snippetHtml: buildSnippet(ex.prefix, ex.term, ex.suffix),
          note: ex.note,
        };
        g.occurrences.push(occ);
        if (ex.note) g.notes.add(ex.note);
        if (ex.pageLabel) g.pages.add(ex.pageLabel);
        else if (Number.isFinite(ex.pageIndex)) g.pages.add(String(ex.pageIndex + 1));
      }

      const arr = Array.from(map.values());
      if (pdfUrl) {
        for (const g of arr) {
          if (!g.pdfUrl) g.pdfUrl = pdfUrl;
        }
      }
      for (const g of arr) {
        const noteText = normalizeSpace(Array.from(g.notes).join(" "));
        const pages = Array.from(g.pages);
        const notes = Array.from(g.notes);
        const preview = notes.length ? previewFromMarkdown(notes[0]) : "";
        const imageCount = notes.reduce((sum, n) => sum + noteImageUrls(n).length, 0);
        const firstImage = notes.length ? (noteImageUrls(notes[0])[0] || null) : null;
        g.preview = preview;
        g.imageCount = imageCount;
        g.firstImage = firstImage;
        g.searchText = (g.term + " " + noteText + " " + pages.join(" ")).toLowerCase();
      }

      arr.sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: "base" }));
      return { grouped: arr, pdfUrl };
    }

    function parseRoute() {
      const raw = (location.hash || "").replace(/^#/, "");
      const params = new URLSearchParams(raw);
      const term = normalizeSpace(params.get("term") || "");
      const q = params.get("q");
      return { term: term || null, q: q ?? null };
    }

    function setRoute({ term, q }) {
      const params = new URLSearchParams();
      if (term) params.set("term", term);
      if (q) params.set("q", q);
      const next = params.toString();
      const nextHash = next ? ("#" + next) : "";
      if (nextHash === location.hash) return;
      history.replaceState(null, "", nextHash);
    }

    function showListView() {
      elViewTerm.style.display = "none";
      elViewList.style.display = "";
      elBtnBack.style.display = "none";
      document.title = "Glossary — Chapter 1 (BC Science 10)";
    }

    function showTermView() {
      elViewList.style.display = "none";
      elViewTerm.style.display = "";
      elBtnBack.style.display = "";
    }

    function renderList(groups, query) {
      const q = normalizeSpace(query).toLowerCase();
      const visible = q ? groups.filter((g) => g.searchText.includes(q)) : groups.slice();

      elResults.textContent = "";
      const frag = document.createDocumentFragment();

      for (const g of visible) {
        const card = document.createElement("div");
        card.className = "panel";
        card.style.padding = "0";

        const a = document.createElement("a");
        a.href = "#term=" + encodeURIComponent(g.key) + (q ? ("&q=" + encodeURIComponent(q)) : "");
        a.style.display = "flex";
        a.style.gap = "10px";
        a.style.alignItems = "center";
        a.style.justifyContent = "space-between";
        a.style.padding = "12px";
        a.style.textDecoration = "none";
        a.style.borderRadius = "16px";

        const left = document.createElement("div");
        left.className = "term-left";

        const titleRow = document.createElement("div");
        titleRow.className = "term-title";
        const title = document.createElement("span");
        title.textContent = g.term;
        titleRow.appendChild(title);
        left.appendChild(titleRow);

        if (g.preview) {
          const preview = document.createElement("div");
          preview.className = "term-preview";
          preview.textContent = g.preview;
          left.appendChild(preview);
        }

        const meta = document.createElement("div");
        meta.className = "term-meta";

        const b1 = document.createElement("span");
        b1.className = "badge";
        b1.textContent = `${g.imageCount || 0} image${(g.imageCount || 0) === 1 ? "" : "s"}`;

        const b2 = document.createElement("span");
        b2.className = "badge";
        b2.textContent = `${g.pages.size} page${g.pages.size === 1 ? "" : "s"}`;

        meta.appendChild(b1);
        meta.appendChild(b2);

        a.appendChild(left);
        a.appendChild(meta);
        card.appendChild(a);
        frag.appendChild(card);
      }

      elResults.appendChild(frag);
      setStatus(
        `<span class="badge">${visible.length} term${visible.length === 1 ? "" : "s"} shown</span>` +
        ` <span class="badge">${groups.length} total terms</span>`
      );
    }

    function renderTermPage(group) {
      elViewTerm.textContent = "";

      const head = document.createElement("div");
      head.className = "panel";
      head.style.marginBottom = "12px";

      const headInner = document.createElement("div");
      headInner.className = "panel-head";
      headInner.style.borderBottom = "1px solid var(--line)";
      headInner.style.display = "flex";
      headInner.style.justifyContent = "space-between";
      headInner.style.alignItems = "center";

      const titleWrap = document.createElement("div");
      titleWrap.style.display = "flex";
      titleWrap.style.flexDirection = "column";
      titleWrap.style.gap = "2px";

      const h = document.createElement("div");
      h.style.fontSize = "16px";
      h.style.fontWeight = "800";
      h.textContent = group.term;
      const sub = document.createElement("div");
      sub.className = "small";
      sub.textContent = `${group.imageCount || 0} image(s) • ${group.pages.size} page(s) • ${group.occurrences.length} occurrence(s)`;
      titleWrap.appendChild(h);
      titleWrap.appendChild(sub);

      const actions = document.createElement("div");
      actions.className = "row";

      const idx = grouped.findIndex((x) => x.key === group.key);
      const prev = idx > 0 ? grouped[idx - 1] : null;
      const next = idx >= 0 && idx < grouped.length - 1 ? grouped[idx + 1] : null;

      const btnPrev = document.createElement("button");
      btnPrev.className = "btn";
      btnPrev.type = "button";
      btnPrev.textContent = "Prev";
      btnPrev.disabled = !prev;
      btnPrev.addEventListener("click", () => {
        if (!prev) return;
        const { q } = parseRoute();
        setRoute({ term: prev.key, q });
        renderRoute();
      });

      const btnNext = document.createElement("button");
      btnNext.className = "btn";
      btnNext.type = "button";
      btnNext.textContent = "Next";
      btnNext.disabled = !next;
      btnNext.addEventListener("click", () => {
        if (!next) return;
        const { q } = parseRoute();
        setRoute({ term: next.key, q });
        renderRoute();
      });

      const firstOcc = group.occurrences[0] || {};
      const pdfLink = document.createElement("a");
      pdfLink.className = "btn";
      pdfLink.href = linkToPdf(group.pdfUrl || pdfUrlGlobal, firstOcc.pageLabel, firstOcc.pageIndex);
      pdfLink.target = "_blank";
      pdfLink.rel = "noopener";
      pdfLink.textContent = "Open in PDF";
      actions.appendChild(btnPrev);
      actions.appendChild(btnNext);
      actions.appendChild(pdfLink);

      headInner.appendChild(titleWrap);
      headInner.appendChild(actions);
      head.appendChild(headInner);

      const body = document.createElement("div");
      body.className = "panel-body";

      const notes = Array.from(group.notes);
      if (notes.length) {
        for (const note of notes) {
          const block = document.createElement("div");
          block.style.marginBottom = "12px";
          renderMarkdownish(block, note);
          body.appendChild(block);
        }
      } else {
        const p = document.createElement("div");
        p.className = "small warn";
        p.textContent = "No explanation text found for this term (only occurrences in the PDF).";
        body.appendChild(p);
      }

      const occPanel = document.createElement("div");
      occPanel.className = "term-section";
      const oh = document.createElement("h3");
      oh.textContent = "Occurrences in the PDF";
      const oc = document.createElement("div");
      oc.className = "content";
      oc.style.padding = "0";

      for (const occ of group.occurrences) {
        const row = document.createElement("div");
        row.className = "occ";
        const leftCol = document.createElement("div");
        const pageLabel = occ.pageLabel || (Number.isFinite(occ.pageIndex) ? String(occ.pageIndex + 1) : "?");
        const a = document.createElement("a");
        a.href = linkToPdf(group.pdfUrl || pdfUrlGlobal, occ.pageLabel, occ.pageIndex);
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = `p.${pageLabel}`;
        leftCol.appendChild(a);

        const rightCol = document.createElement("div");
        rightCol.className = "snippet";
        rightCol.innerHTML = occ.snippetHtml;

        row.appendChild(leftCol);
        row.appendChild(rightCol);
        oc.appendChild(row);
      }
      occPanel.appendChild(oh);
      occPanel.appendChild(oc);
      body.appendChild(occPanel);

      head.appendChild(body);
      elViewTerm.appendChild(head);

      document.title = `${group.term} — Glossary (Chapter 1)`;
      setStatus(`<span class="badge">${escapeHtml(group.term)}</span>`);
    }

    function renderRoute() {
      const { term, q } = parseRoute();
      if (q !== null && elQ.value !== q) elQ.value = q;
      if (!term) {
        showListView();
        renderList(grouped, elQ.value);
        return;
      }
      const g = groupedByKey.get(term.toLowerCase());
      if (!g) {
        showListView();
        elHelp.insertAdjacentHTML("beforeend", `<div class="small warn" style="margin-top:8px;">Unknown term key: <code>${escapeHtml(term)}</code></div>`);
        renderList(grouped, elQ.value);
        return;
      }
      showTermView();
      renderTermPage(g);
      window.scrollTo(0, 0);
    }

    async function loadJsonFromFetch(path) {
      const resp = await fetch(path, { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    }

    function loadJsonFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          try { resolve(JSON.parse(String(reader.result))); }
          catch (e) { reject(e); }
        };
        reader.onerror = () => reject(reader.error || new Error("Failed to read file"));
        reader.readAsText(file);
      });
    }

    async function loadAndRender(data) {
      if (!data || typeof data !== "object" || !Array.isArray(data.annotations)) {
        throw new Error("Unexpected JSON format (expected { annotations: [...] })");
      }

      const { grouped: g, pdfUrl } = groupAnnotations(data.annotations);
      grouped = g;
      pdfUrlGlobal = pdfUrl;
      groupedByKey.clear();
      for (const item of grouped) groupedByKey.set(item.key, item);

      const pdfHref = pdfUrl || FALLBACK_PDF_PATH;
      const pdfButton = document.querySelector('a[href="assets/BC_Science10-Ch01.pdf"]');
      if (pdfButton) pdfButton.href = pdfHref;

      renderRoute();
      elHelp.innerHTML =
        `<span class="badge">Loaded ${data.annotations.length} annotations</span>` +
        ` <span class="badge">${grouped.length} unique terms</span>` +
        (pdfUrl ? ` <span class="badge">PDF: <a href="${escapeHtml(pdfUrl)}" target="_blank" rel="noopener">${escapeHtml(clampText(pdfUrl, 60))}</a></span>` : "");
    }

    async function tryAutoLoad() {
      try {
        setStatus(`<span class="badge">Loading…</span>`);
        const data = await loadJsonFromFetch(DEFAULT_JSON_PATH);
        await loadAndRender(data);
        elHelp.insertAdjacentHTML("beforeend", ` <span class="badge">Auto-loaded</span>`);
      } catch (e) {
        setStatus(`<span class="badge danger">Auto-load failed</span>`);
        elHelp.innerHTML = `
          <div class="small danger">Could not auto-load <code>${escapeHtml(DEFAULT_JSON_PATH)}</code> (common when opening this page as <code>file://</code>).</div>
          <div class="small" style="margin-top:6px;">
            Options:
            <ul>
              <li>Click <span class="warn">Load JSON file</span> and select <code>${escapeHtml(DEFAULT_JSON_PATH)}</code>.</li>
              <li>Or start a local server: <code>python -m http.server 8000</code> and open <code>http://localhost:8000/glossary_chapter1.html</code>.</li>
            </ul>
          </div>
        `;
      }
    }

    elQ.addEventListener("input", () => {
      const { term } = parseRoute();
      if (term) {
        setRoute({ term: null, q: elQ.value });
        renderRoute();
        return;
      }
      setRoute({ term: null, q: elQ.value });
      renderRoute();
    });

    document.getElementById("btnReload").addEventListener("click", () => {
      tryAutoLoad();
    });

    elFileInput.addEventListener("change", async () => {
      const file = elFileInput.files && elFileInput.files[0];
      if (!file) return;
      try {
        setStatus(`<span class="badge">Loading file…</span>`);
        const data = await loadJsonFromFile(file);
        await loadAndRender(data);
        elHelp.insertAdjacentHTML("beforeend", ` <span class="badge">Loaded from file</span>`);
      } catch (e) {
        setStatus(`<span class="badge danger">Failed to load file</span>`);
        elHelp.insertAdjacentHTML("beforeend", `<div class="small danger" style="margin-top:6px;">${escapeHtml(String(e && e.message ? e.message : e))}</div>`);
      }
    });

    elBtnBack.addEventListener("click", () => {
      const { q } = parseRoute();
      setRoute({ term: null, q: q || elQ.value });
      renderRoute();
    });

    window.addEventListener("hashchange", () => renderRoute());
    window.addEventListener("keydown", (e) => {
      if (e.defaultPrevented) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const active = document.activeElement;
      const tag = active && active.tagName ? active.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select" || (active && active.isContentEditable)) return;

      const { term, q } = parseRoute();
      if (!term) return;

      const key = String(term).toLowerCase();
      const idx = grouped.findIndex((x) => x.key === key);
      if (idx < 0) return;

      if (e.key === "ArrowLeft") {
        const prev = idx > 0 ? grouped[idx - 1] : null;
        if (!prev) return;
        e.preventDefault();
        setRoute({ term: prev.key, q });
        renderRoute();
      } else if (e.key === "ArrowRight") {
        const next = idx < grouped.length - 1 ? grouped[idx + 1] : null;
        if (!next) return;
        e.preventDefault();
        setRoute({ term: next.key, q });
        renderRoute();
      }
    });

    // Swipe navigation (mobile): left = next, right = prev.
    (() => {
      let startX = 0;
      let startY = 0;
      let startT = 0;
      let tracking = false;

      function shouldIgnoreTarget(target) {
        const el = target && target.closest ? target.closest("input, textarea, select, button, a, summary") : null;
        return Boolean(el);
      }

      window.addEventListener("touchstart", (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        if (shouldIgnoreTarget(e.target)) return;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        startT = Date.now();
        tracking = true;
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (!tracking || !e.touches || e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        // If user scrolls vertically, stop tracking.
        if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)) tracking = false;
      }, { passive: true });

      window.addEventListener("touchend", (e) => {
        if (!tracking) return;
        tracking = false;

        const dt = Date.now() - startT;
        if (dt > 800) return;

        const t = (e.changedTouches && e.changedTouches[0]) || null;
        if (!t) return;
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        // Require a mostly-horizontal swipe.
        if (Math.abs(dx) < 70) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.4) return;

        const { term, q } = parseRoute();
        if (!term) return;
        const key = String(term).toLowerCase();
        const idx = grouped.findIndex((x) => x.key === key);
        if (idx < 0) return;

        if (dx > 0) {
          const prev = idx > 0 ? grouped[idx - 1] : null;
          if (!prev) return;
          setRoute({ term: prev.key, q });
          renderRoute();
        } else {
          const next = idx < grouped.length - 1 ? grouped[idx + 1] : null;
          if (!next) return;
          setRoute({ term: next.key, q });
          renderRoute();
        }
      }, { passive: true });
    })();

    tryAutoLoad();
  </script>
</body>
</html>
