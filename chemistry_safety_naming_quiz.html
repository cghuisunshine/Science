<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry Safety & Naming Quiz</title>
  <link rel="icon" href="data:,">
  <style>
    :root{
      --green:#4b7f0e;
      --green-soft:#eef8eb;
      --red:#b50000;
      --gray:#555;
      --light:#f7f7f7;
      --border:#d8d8d8;
      --blue:#2563eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#ffffff;
      color:#333;
      line-height:1.45;
    }
    body[data-lang-mode="en"] .lang-zh{display:none!important;}
    body[data-lang-mode="zh"] .lang-en{display:none!important;}
    .lang-zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif;}
    body[data-lang-mode="bi"] .lang-en + .lang-zh{margin-left:.35em;}
    header{
      padding:28px 18px 18px;
      background:linear-gradient(135deg,#f2faf0,#ffffff);
      border-bottom:1px solid var(--border);
    }
    .wrap{max-width:1000px;margin:0 auto;padding:0 16px;}
    h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px;font-weight:500;}
    .subtitle{font-size:18px;color:#555;margin:0;}
    .toolbar{
      position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);
      box-shadow:0 2px 12px rgba(0,0,0,.05);
    }
    .toolbar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap;}
    .languageControls{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
    .progressText{font-weight:700;color:#333;}
    .progressBar{height:12px;background:#e9e9e9;border-radius:999px;overflow:hidden;flex:1;min-width:180px;max-width:460px;}
    .progressFill{height:100%;width:0%;background:var(--green);transition:.25s;}
    button{
      border:0;border-radius:8px;padding:10px 16px;font-size:16px;cursor:pointer;background:var(--green);color:white;
    }
    .modeButton{border-radius:0;border-right:1px solid var(--border);background:#fff;color:#333;}
    .modeButton:last-child{border-right:0;}
    .modeButton[aria-pressed="true"]{background:#e9e9e9;}
    button.secondary{background:#666;}
    button.ghost{background:#eef2ff;color:#1e40af;}
    main{padding:26px 0 60px;}
    .card{
      border:1px solid var(--border);border-radius:8px;margin:0 0 24px;background:#fff;overflow:hidden;
    }
    .cardHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:#fafafa;padding:18px 20px;border-bottom:1px solid var(--border);}
    .qnum{font-size:30px;font-weight:500;color:#444;}
    .weight{font-style:italic;color:#777;font-size:15px;}
    .cardBody{padding:22px 20px;}
    .question{font-size:24px;margin:0 0 22px;}
    .formula{font-family:Georgia, 'Times New Roman', serif;font-style:italic;font-size:48px;margin:8px 0 22px;letter-spacing:.5px;}
    sub{font-size:.55em;vertical-align:sub;}
    .options{display:grid;gap:12px;margin-top:8px;}
    label.option{
      display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid transparent;border-radius:8px;font-size:22px;cursor:pointer;
    }
    label.option:hover{background:#f8f8f8;}
    label.option.correctShow{background:var(--green-soft);border-left:6px solid var(--green);}
    label.option.wrongShow{background:#fff1f1;border-left:6px solid #c62828;}
    input[type="radio"]{width:20px;height:20px;accent-color:var(--green);}
    input[type="text"]{
      width:100%;max-width:720px;border:2px solid #aaa;border-radius:4px;padding:12px 14px;font-size:24px;
    }
    input[type="text"].correctInput{background:var(--green-soft);border-color:#7fb36d;}
    input[type="text"].wrongInput{background:#fff1f1;border-color:#c62828;}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
    .feedback{margin-top:18px;font-size:18px;display:none;}
    .feedback.good{color:var(--green);}
    .feedback.bad{color:#b50000;}
    .solution{
      margin-top:22px;background:#fafafa;padding:20px;border-radius:8px;border-left:5px solid var(--red);display:none;color:var(--red);
    }
    .solution h3{font-size:34px;margin:0 0 14px;font-weight:400;color:var(--red);}
    .solution p{font-size:20px;margin:10px 0;}
    .bigAnswer{font-family:Georgia,'Times New Roman',serif;font-size:38px;font-style:italic;margin-top:10px;}
    .symbolBox{display:flex;justify-content:center;margin:10px 0 28px;}
    .corrosive{width:240px;max-width:70%;}
    .tick{margin-left:auto;color:var(--green);font-weight:bold;font-size:28px;display:none;}
    .correctShow .tick{display:inline;}
    .summary{border:2px solid var(--green);background:#f5fff2;border-radius:8px;padding:22px;margin-top:26px;display:none;}
    .summary h2{margin:0 0 10px;font-size:30px;}
    @media(max-width:650px){
      .question{font-size:21px}.formula{font-size:42px}label.option{font-size:20px}.cardHead{padding:14px}.cardBody{padding:16px}.qnum{font-size:26px}
      .languageControls,.toolbar button{width:100%}.languageControls .modeButton{flex:1}
    }
  </style>
</head>
<body data-lang-mode="en">
<header>
  <div class="wrap">
    <h1><span class="lang-en">Chemistry Safety & Naming Quiz</span><span class="lang-zh" lang="zh-Hans">化学安全与命名测验</span></h1>
    <p class="subtitle"><span class="lang-en">Practice questions based on the screenshots: lab safety, hazard symbols, ionic names, covalent names, and formulas.</span><span class="lang-zh" lang="zh-Hans">根据截图练习：实验室安全、危险符号、离子化合物命名、共价化合物命名和化学式。</span></p>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <span class="progressText"><span class="lang-en">Score:</span><span class="lang-zh" lang="zh-Hans">得分：</span> <span id="score">0</span>/<span id="total">8</span></span>
    <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
    <div class="languageControls" role="group" aria-label="Language mode">
      <button class="modeButton" type="button" data-set-lang="en" aria-pressed="true">English</button>
      <button class="modeButton" type="button" data-set-lang="bi" aria-pressed="false">En+Zh</button>
      <button class="modeButton" type="button" data-set-lang="zh" aria-pressed="false">中文</button>
    </div>
    <button class="ghost" onclick="checkAll()"><span class="lang-en">Check All</span><span class="lang-zh" lang="zh-Hans">检查全部</span></button>
    <button class="secondary" onclick="resetQuiz()"><span class="lang-en">Reset</span><span class="lang-zh" lang="zh-Hans">重置</span></button>
  </div>
</div>

<main class="wrap" id="quiz"></main>

<script>
const questions = [

    solution:'Correct, good job! Water can conduct electricity, so a dry work area lowers the risk of electric shock.',

    answer:'SbBr₃',
    solution:'Antimony is Sb. The prefix tri- means 3 bromine atoms, so the formula is SbBr₃.',

    formula:'SiBr<sub>6</sub>',

    solution:'One silicon is named silicon, and 6 bromine atoms use the prefix hexa-. The compound name is silicon hexabromide.',

    title:'What is the name of this compound?',

    choicesZh:['magnesium chromium oxide','magnesium dichromate','magnesium heptachromate','magnesium chromate'],
    answer:'magnesium dichromate',
    solution:'Cr₂O₇²⁻ is the dichromate ion. Mg²⁺ combines with one dichromate ion, so MgCr₂O₇ is magnesium dichromate.',

const quiz = document.getElementById('quiz');
document.getElementById('total').textContent = questions.length;
const modeButtons = Array.from(document.querySelectorAll('.modeButton'));
const labels = {
  item:['Item','题目'],
  weight:['Weight','分值'],
  checkQuestion:['Check This Question','检查本题'],
  revealSolution:['Reveal Solution','显示解析'],
  solution:['Solution','解答'],
  complete:['Quiz complete!','测验完成！'],

  wrong:['Not quite. Try again or reveal the solution.','不完全正确。再试一次，或显示解析。'],
  scored:['You scored','你的得分是'],
  outOf:['out of','满分']

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function renderI18n(en, zh){
  return `<span class="lang-en">${escapeHtml(en)}</span><span class="lang-zh" lang="zh-Hans">${escapeHtml(zh ?? en)}</span>`;
}

function setMode(mode){
  const nextMode = ['en','bi','zh'].includes(mode) ? mode : 'en';
  document.body.dataset.langMode = nextMode;
  document.documentElement.lang = mode === 'zh' ? 'zh-Hans' : 'en';
  modeButtons.forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.setLang === nextMode));
  });
}

function render(){
  quiz.innerHTML = questions.map((q,i)=>{
    const formula = q.formula ? `<div class="formula">${q.formula}</div>` : '';
    const symbol = q.symbol === 'corrosive' ? corrosiveSvg() : '';
    const input = q.type === 'text'
      ? `<input type="text" id="text-${i}" placeholder="Type your answer here" oninput="clearState(${i})">`
      : `<div class="options">${q.choices.map((c,idx)=>`<label class="option" id="opt-${i}-${idx}"><input type="radio" name="q${i}" value="${escapeHtml(c)}" onchange="clearState(${i})"><span>${renderI18n(c, q.choicesZh[idx])}</span><span class="tick">✓</span></label>`).join('')}</div>`;
    return `<section class="card" id="card-${i}">
      <div class="cardHead"><div class="qnum">${renderI18n(labels.item[0], labels.item[1])} ${i+1}</div><div class="weight">${renderI18n(labels.weight[0], labels.weight[1])}: ${(100/questions.length).toFixed(1)}%</div></div>
      <div class="cardBody">
        <p class="question">${renderI18n(q.title, q.titleZh)}</p>${formula}${symbol}${input}
        <div class="actions"><button onclick="checkOne(${i})">${renderI18n(labels.checkQuestion[0], labels.checkQuestion[1])}</button><button class="ghost" onclick="showSolution(${i})">${renderI18n(labels.revealSolution[0], labels.revealSolution[1])}</button></div>
        <div class="feedback" id="fb-${i}"></div>
        <div class="solution" id="sol-${i}"><h3>${renderI18n(labels.solution[0], labels.solution[1])}</h3><p>${renderI18n(q.solution, q.solutionZh)}</p><div class="bigAnswer">${escapeHtml(q.answer)}</div></div>
      </div>
    </section>`;
  }).join('') + `<div class="summary" id="summary"><h2>${renderI18n(labels.complete[0], labels.complete[1])}</h2><p id="summaryText"></p></div>`;
}

function normalize(s){return (s||'').toLowerCase().replace(/[₀₁₂₃₄₅₆₇₈₉]/g, d=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(d)]).replace(/\s+/g,' ').trim();}
function getAnswer(i){
  const q=questions[i];
  if(q.type==='text') return document.getElementById(`text-${i}`).value;
  const selected=document.querySelector(`input[name="q${i}"]:checked`);
  return selected?selected.value:'';
}
function clearState(i){
  document.getElementById(`fb-${i}`).style.display='none';
  if(questions[i].type==='text'){
    document.getElementById(`text-${i}`).classList.remove('correctInput','wrongInput');
  } else {
    questions[i].choices.forEach((_,idx)=>document.getElementById(`opt-${i}-${idx}`).classList.remove('correctShow','wrongShow'));
  }
}
function checkOne(i){
  const q=questions[i], ans=getAnswer(i), ok=normalize(ans)===normalize(q.answer);
  const fb=document.getElementById(`fb-${i}`);
  clearState(i);
  fb.style.display='block'; fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML= ok ? renderI18n(labels.correct[0], labels.correct[1]) : renderI18n(labels.wrong[0], labels.wrong[1]);
  if(q.type==='text') document.getElementById(`text-${i}`).classList.add(ok?'correctInput':'wrongInput');
  else q.choices.forEach((c,idx)=>{
    const el=document.getElementById(`opt-${i}-${idx}`);
    if(normalize(c)===normalize(q.answer)) el.classList.add('correctShow');
    else if(normalize(c)===normalize(ans) && !ok) el.classList.add('wrongShow');
  });
  updateScore(); return ok;
}
function showSolution(i){document.getElementById(`sol-${i}`).style.display='block';checkOne(i);}
function checkAll(){let correct=0;questions.forEach((_,i)=>{if(checkOne(i)) correct++;document.getElementById(`sol-${i}`).style.display='block';});document.getElementById('summary').style.display='block';document.getElementById('summaryText').innerHTML=`${renderI18n(labels.scored[0], labels.scored[1])} ${correct} ${renderI18n(labels.outOf[0], labels.outOf[1])} ${questions.length}.`;}
function updateScore(){let correct=0;questions.forEach((q,i)=>{if(normalize(getAnswer(i))===normalize(q.answer)) correct++;});document.getElementById('score').textContent=correct;document.getElementById('progressFill').style.width=(correct/questions.length*100)+'%';}
function resetQuiz(){render();updateScore();setMode(document.body.dataset.langMode || 'en');window.scrollTo({top:0,behavior:'smooth'});}
render();
modeButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.setLang)));
setMode('en');
</script>
