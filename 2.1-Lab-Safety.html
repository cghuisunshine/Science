<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.1 Lab Safety</title>
  <style>
    :root{
      --paper-width: 8.5in;
      --paper-min-height: 11in;
      --bg: #ece7df;
      --page: #ffffff;
      --ink: #1f2328;
      --muted: #5f6368;
      --line: #b9b1a4;
      --line-strong: #7a7267;
      --surface: #f7f4ef;
      --accent: #7c2d12;
      --accent-soft: #efe3d5;
      --shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
    }

    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Calibri, "Aptos", "Segoe UI", sans-serif;
      line-height: 1.35;
    }

    .topbar-global{
      width: min(1580px, calc(100vw - 40px));
      margin: 18px auto 0;
      display: flex;
      justify-content: flex-end;
    }

    .lang-controls{
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .lang-btn{
      padding: 7px 12px;
      border: 1px solid rgba(31, 35, 40, 0.18);
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    .lang-btn.is-active{
      background: #e8ddd0;
      border-color: rgba(124, 45, 18, 0.35);
    }

    .lang-btn:focus-visible{
      outline: 3px solid rgba(124, 45, 18, 0.25);
      outline-offset: 2px;
    }

    .i18n-wrap{
      max-width: 100%;
    }

    .i18n-en{
      display: block;
    }

    .i18n-zh{
      display: none;
      margin-top: 4px;
      color: #2b2b2b;
    }

    .i18n-inline .i18n-en,
    .i18n-inline .i18n-zh{
      display: inline;
    }

    .i18n-inline .i18n-zh{
      display: none;
      margin-top: 0;
    }

    body.lang-bi .i18n-zh{
      display: block;
    }

    body.lang-bi .i18n-inline .i18n-zh{
      display: inline;
    }

    body.lang-zh .i18n-en{
      display: none !important;
    }

    body.lang-zh .i18n-zh{
      display: block;
    }

    body.lang-zh .i18n-inline .i18n-zh{
      display: inline;
    }

    .wrapper{
      padding: 24px 0 40px;
    }

    .page{
      width: min(1580px, calc(100vw - 40px));
      min-height: var(--paper-min-height);
      margin: 0 auto 20px;
      background: var(--page);
      box-shadow: var(--shadow);
      padding: 0.72in 0.72in 0.78in;
      position: relative;
    }

    .page.page-exercise{
      min-height: auto;
    }

    .page-header{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      border-bottom: 2px solid var(--line-strong);
      padding-bottom: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .page-header .course{
      font-weight: 700;
    }

    .page-header .page-no{
      color: var(--muted);
      white-space: nowrap;
    }

    h1{
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
    }

    h2{
      margin: 18px 0 10px;
      font-size: 21px;
      line-height: 1.2;
    }

    h3{
      margin: 14px 0 8px;
      font-size: 17px;
      line-height: 1.2;
    }

    p{
      margin: 8px 0;
      font-size: 15px;
    }

    ul, ol{
      margin: 8px 0 10px 22px;
      padding: 0;
      font-size: 15px;
    }

    li{
      margin: 5px 0;
    }

    .intro-box{
      border: 1px solid var(--line-strong);
      background: var(--surface);
      padding: 14px 16px;
      margin: 14px 0 18px;
    }

    .objective-list{
      margin-top: 8px;
    }

    .objective-list li{
      margin: 6px 0;
      font-weight: 700;
    }

    .section-note{
      color: var(--muted);
      margin-top: 0;
    }

    .rule-list{
      margin-left: 24px;
    }

    .rule-list li{
      padding-left: 2px;
    }

    .symbol-lead{
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      padding: 10px 12px;
      margin: 10px 0 16px;
    }

    .card-grid{
      display: grid;
      gap: 12px;
      margin: 14px 0 18px;
    }

    .hhps-grid{
      grid-template-columns: 1fr 1fr;
    }

    .whmis-grid{
      grid-template-columns: 1fr 1fr;
    }

    .symbol-card{
      border: 1px solid var(--line);
      display: grid;
      grid-template-columns: 120px 1fr;
      min-height: 130px;
    }

    .symbol-visual{
      border-right: 1px solid var(--line);
      background: #fbfaf8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .symbol-visual img{
      max-width: 84px;
      max-height: 84px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .symbol-copy{
      padding: 12px 14px;
    }

    .symbol-copy h3{
      margin-top: 0;
    }

    .symbol-copy p:last-child,
    .symbol-copy ul:last-child{
      margin-bottom: 0;
    }

    .hazard-meaning{
      font-weight: 700;
    }

    .review-box{
      border: 1px solid var(--line-strong);
      padding: 14px 16px;
      background: #fcfbf9;
      margin-top: 12px;
    }

    .exercise-toolbar{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }

    .exercise-status{
      font-size: 14px;
      color: var(--muted);
    }

    .exercise-actions{
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .exercise-button{
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .exercise-button:hover{
      background: #f4efe8;
    }

    .matching-board{
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 18px;
      margin-top: 10px;
      background: linear-gradient(180deg, #2d4372, #23345d);
      border: 1px solid #263558;
      padding: 16px;
      color: #f7fbff;
    }

    .matching-prompt{
      margin: 0 0 14px;
      font-size: 15px;
      text-align: center;
      color: #dbe8ff;
    }

    .clue-bank{
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .clue-chip{
      width: 100%;
      border: 1px solid rgba(18, 44, 88, 0.55);
      background: #d8f4ff;
      color: #22303e;
      padding: 10px 12px;
      text-align: center;
      font: inherit;
      font-weight: 700;
      line-height: 1.2;
      cursor: grab;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
    }

    .clue-chip:active{
      cursor: grabbing;
    }

    .clue-chip.is-selected{
      outline: 3px solid #ffd76b;
      outline-offset: 2px;
    }

    .clue-chip.is-hidden{
      display: none;
    }

    .rule-grid{
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      align-content: start;
    }

    .rule-card{
      background: #4e95c4;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 12px;
      min-height: 248px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
    }

    .rule-text{
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.25;
      text-align: center;
      color: #0d1b2a;
    }

    .drop-zone{
      border: 3px dashed rgba(255, 255, 255, 0.75);
      background: rgba(96, 191, 233, 0.9);
      color: #ffffff;
      min-height: 64px;
      width: 100%;
      padding: 10px 8px;
      text-align: center;
      font: inherit;
      font-size: 14px;
      line-height: 1.2;
      cursor: pointer;
    }

    .drop-zone.is-active{
      border-color: #ffd76b;
      box-shadow: inset 0 0 0 2px rgba(255, 215, 107, 0.35);
    }

    .drop-zone.is-filled{
      background: #e5f9ff;
      color: #153045;
      border-style: solid;
      border-color: #f7fbff;
      font-weight: 700;
    }

    .small{
      font-size: 14px;
    }

    @media print{
      body{
        background: #fff;
      }

      .wrapper{
        padding: 0;
      }

      .page{
        width: auto;
        box-shadow: none;
        margin: 0;
        min-height: 0;
        page-break-after: always;
      }

      .page:last-child{
        page-break-after: auto;
      }
    }

      @media (max-width: 920px){
      .wrapper{
        padding: 12px;
      }

      .topbar-global{
        width: 100%;
        margin: 12px auto 0;
        padding: 0 12px;
      }

      .page{
        width: 100%;
        min-height: 0;
        padding: 20px 18px 28px;
      }

      .page.page-exercise{
        width: 100%;
      }

      .hhps-grid,
      .whmis-grid,
      .rule-grid{
        grid-template-columns: 1fr;
      }

      .symbol-card{
        grid-template-columns: 90px 1fr;
      }

      .matching-board{
        grid-template-columns: 1fr;
      }

      .symbol-visual img{
        max-width: 62px;
        max-height: 62px;
      }
    }
  </style>
</head>

    (function () {
      const textEntries = {

          const entry = listEntries[key];
          if (!entry) return;
          element.innerHTML = entry.en.map((english, index) => {
            return "<li>" + bilingualHtml(english, entry.zh[index], false) + "</li>";
          }).join("");
        });
      }

      function applyLanguageMode(mode) {
        currentLang = mode;
        document.body.classList.toggle("lang-bi", mode === "bi");
        document.body.classList.toggle("lang-zh", mode === "zh");
        langButtons.forEach((button) => {
          const selected = button.dataset.lang === mode;
          button.classList.toggle("is-active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        localStorage.setItem("lab-safety-lang", mode);
      }

      function clueButtonById(clueId) {
        return clueButtons.find((button) => button.dataset.clueId === clueId);
      }

      function setActiveClue(clueId) {
        activeClueId = clueId;
        clueButtons.forEach((button) => {
          button.classList.toggle("is-selected", button.dataset.clueId === clueId);
        });
      }

      function clearRule(ruleId) {
        const clueId = clueByRule.get(ruleId);
        if (!clueId) return;
        clueByRule.delete(ruleId);
        ruleByClue.delete(clueId);
        const clueButton = clueButtonById(clueId);
        if (clueButton) clueButton.classList.remove("is-hidden");
      }

      function placeClue(clueId, ruleId) {
        if (!clueId) return;
        const currentRuleForClue = ruleByClue.get(clueId);
        if (currentRuleForClue) {
          clueByRule.delete(currentRuleForClue);
        }
        clearRule(ruleId);
        ruleByClue.set(clueId, ruleId);
        clueByRule.set(ruleId, clueId);
        const clueButton = clueButtonById(clueId);
        if (clueButton) clueButton.classList.add("is-hidden");
        setActiveClue(null);
        render();
      }

      function render() {
        dropZones.forEach((zone) => {
          const clueId = clueByRule.get(zone.dataset.ruleId);
          const clueButton = clueId ? clueButtonById(clueId) : null;
          zone.innerHTML = clueButton ? clueButton.innerHTML : localizedHtml("ui_drop_here", true);
          zone.classList.toggle("is-filled", Boolean(clueId));
        });
        status.innerHTML = bilingualHtml(
          "Placed " + clueByRule.size + " of " + dropZones.length + " clues.",
          "已放置 " + clueByRule.size + " / " + dropZones.length + " 条线索。",
          true
        );
      }

      applyStaticLocalization();
      applyLanguageMode(currentLang);

      langButtons.forEach((button) => {
        button.addEventListener("click", function () {
          applyLanguageMode(button.dataset.lang);
        });
      });

      clueButtons.forEach((button) => {
        button.addEventListener("click", function () {
          if (button.classList.contains("is-hidden")) return;
          const clueId = button.dataset.clueId;
          setActiveClue(activeClueId === clueId ? null : clueId);
        });

        button.addEventListener("dragstart", function (event) {
          setActiveClue(button.dataset.clueId);
          event.dataTransfer.setData("text/plain", button.dataset.clueId);
          event.dataTransfer.effectAllowed = "move";
        });
      });

      dropZones.forEach((zone) => {
        zone.addEventListener("click", function () {
          if (activeClueId) {
            placeClue(activeClueId, zone.dataset.ruleId);
            return;
          }
          clearRule(zone.dataset.ruleId);
          render();
        });

        zone.addEventListener("dragover", function (event) {
          event.preventDefault();
          zone.classList.add("is-active");
        });

        zone.addEventListener("dragleave", function () {
          zone.classList.remove("is-active");
        });

        zone.addEventListener("drop", function (event) {
          event.preventDefault();
          zone.classList.remove("is-active");
          const clueId = event.dataTransfer.getData("text/plain") || activeClueId;
          placeClue(clueId, zone.dataset.ruleId);
        });
      });

      resetButton.addEventListener("click", function () {
        clueByRule.clear();
        ruleByClue.clear();
        clueButtons.forEach((button) => button.classList.remove("is-hidden"));
        setActiveClue(null);
        render();
      });

      render();
    }());
  </script>
</body>
</html>
