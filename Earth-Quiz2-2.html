<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U4 Quiz #2</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --correct: #166534;
      --correct-bg: #dcfce7;
      --wrong: #991b1b;
      --wrong-bg: #fee2e2;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --border: #d1d5db;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .hero p {
      margin: 0;
      opacity: 0.95;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 24px;
      align-items: center;
    }

    .mode-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .mode-control label {
      font-weight: 700;
      color: var(--muted);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .score-box {
      margin-left: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      min-width: 210px;
      text-align: center;
      font-weight: bold;
      box-shadow: var(--shadow);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      margin-bottom: 18px;
      border: 1px solid #e5e7eb;
    }

    .card.question.correct {
      border-color: #86efac;
      background: #f0fdf4;
    }

    .card.question.incorrect {
      border-color: #fca5a5;
      background: #fff7f7;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fafafa;
      cursor: pointer;
    }

    .option:hover {
      background: #f3f4f6;
    }

    .option input {
      margin-top: 3px;
      transform: scale(1.15);
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: white;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
    }

    .feedback.correct {
      display: block;
      background: var(--correct-bg);
      color: var(--correct);
      border: 1px solid #86efac;
    }

    .feedback.wrong {
      display: block;
      background: var(--wrong-bg);
      color: var(--wrong);
      border: 1px solid #fca5a5;
    }

    .feedback.unanswered {
      display: block;
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid #fcd34d;
    }

    .explanation {
      margin-top: 8px;
      font-weight: normal;
    }

    .hidden { display: none; }

    .footer-note {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 12px;
    }

    .localized-text {
      display: inline;
    }

    .localized-stacked {
      display: inline-block;
    }

    .localized-stacked .lang-en,
    .localized-stacked .lang-zh {
      display: block;
    }

    .localized-stacked .lang-zh {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.96em;
    }

    .localized-inline .lang-zh {
      color: var(--muted);
    }

    .hero .localized-stacked .lang-zh,
    .hero .localized-inline .lang-zh,
    .primary .localized-stacked .lang-zh,
    .primary .localized-inline .lang-zh {
      color: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 640px) {
      .score-box {
        margin-left: 0;
        width: 100%;
      }

      .hero {
        padding: 22px 18px;
      }

      .mode-control {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroDescription"></p>
    </section>

    <div class="toolbar">
      <button class="primary" id="submitBtn"></button>
      <button class="secondary" id="resetBtn"></button>
      <button class="secondary" id="showBtn"></button>
      <div class="mode-control">
        <label id="languageModeLabel" for="languageMode"></label>
        <select id="languageMode"></select>
      </div>
      <div class="score-box" id="scoreBox">Score: Not graded yet</div>
    </div>

    <div id="quiz"></div>

    <p class="footer-note" id="footerNote"></p>
  </div>

  <script>
    const uiText = {
      title: { en: 'U4 Quiz #2', zh: '第四单元测验 2' },
      instructions: {
        en: 'Use Grade Quiz to check all eight questions and see your score, or show the answers for review.',
        zh: '点击“批改测验”可检查全部八道题并查看分数，或点击“显示答案”进行复习。'
      },
      gradeQuiz: { en: 'Grade Quiz', zh: '批改测验' },
      reset: { en: 'Reset', zh: '重置' },
      showAnswers: { en: 'Show Answers', zh: '显示答案' },
      displayMode: { en: 'Display Mode', zh: '显示模式' },
      englishOnly: { en: 'English Only', zh: '仅英文' },
      bilingual: { en: 'English + Chinese', zh: '英文 + 中文' },
      zhOnly: { en: 'Chinese Only', zh: '仅中文' },
      scoreLabel: { en: 'Score', zh: '分数' },
      scoreNotGraded: { en: 'Score: Not graded yet', zh: '分数：尚未批改' },
      scoreAnswersDisplayed: { en: 'Score: Answers displayed', zh: '分数：已显示答案' },
      correct: { en: 'Correct.', zh: '正确。' },
      incorrect: { en: 'Incorrect.', zh: '不正确。' },
      notAnswered: { en: 'Not answered.', zh: '未作答。' },
      correctAnswer: { en: 'Correct answer:', zh: '正确答案：' },
      footerTip: {
        en: 'Tip: Review the explanation under each question after grading to reinforce the unit concepts.',
        zh: '提示：批改后查看每题下方的解释，有助于巩固本单元概念。'
      }
    };

    const languageOptions = [
      { value: 'en', label: uiText.englishOnly },
      { value: 'bilingual', label: uiText.bilingual },
      { value: 'zh', label: uiText.zhOnly }
    ];

    const quizData = [
      {
        question: {
          en: 'The apparent magnitude of a star is a measure of its',
          zh: '恒星的视星等是用来衡量它的'
        },
        options: [
          { en: 'position on the H-R diagram', zh: '在赫罗图上的位置' },
          { en: 'luminosity at a standard distance', zh: '在标准距离下的光度' },
          { en: 'distance from the Earth', zh: '与地球的距离' },
          { en: 'brightness as it appears from Earth', zh: '从地球看起来的亮度' }
        ],
        answer: 3,
        explanation: {
          en: 'Apparent magnitude tells us how bright a star appears from Earth.',
          zh: '视星等表示一颗恒星从地球看起来有多亮。'
        }
      },
      {
        question: {
          en: 'The brightness of a star is called its _____ .',
          zh: '恒星的亮度称为它的_____。'
        },
        options: [
          { en: 'magnitude', zh: '星等' },
          { en: 'contrast', zh: '对比度' },
          { en: 'aptitude', zh: '能力' },
          { en: 'distance', zh: '距离' }
        ],
        answer: 0,
        explanation: {
          en: 'In astronomy, a star’s brightness is described using magnitude.',
          zh: '在天文学中，恒星的亮度用星等来描述。'
        }
      },
      {
        question: {
          en: 'Which of the following planets does not have an appreciable atmosphere?',
          zh: '以下哪颗行星没有明显的大气层？'
        },
        options: [
          { en: 'Saturn', zh: '土星' },
          { en: 'Mercury', zh: '水星' },
          { en: 'Jupiter', zh: '木星' },
          { en: 'Venus', zh: '金星' }
        ],
        answer: 1,
        explanation: {
          en: 'Mercury has only an extremely thin exosphere, so it does not have an appreciable atmosphere.',
          zh: '水星只有极其稀薄的外逸层，因此没有明显的大气层。'
        }
      },
      {
        question: {
          en: 'Which of the following groups of planets all have moons?',
          zh: '以下哪一组行星全都有卫星？'
        },
        options: [
          { en: 'Jupiter, Uranus, Venus', zh: '木星、天王星、金星' },
          { en: 'Mars, Neptune, Jupiter', zh: '火星、海王星、木星' },
          { en: 'Earth, Saturn, Mercury', zh: '地球、土星、水星' },
          { en: 'Jupiter, Mercury, Neptune', zh: '木星、水星、海王星' }
        ],
        answer: 1,
        explanation: {
          en: 'Mars, Neptune, and Jupiter all have moons, while Mercury and Venus do not.',
          zh: '火星、海王星和木星都有卫星，而水星和金星没有。'
        }
      },
      {
        question: {
          en: 'In our solar system, which planets formed first: the inner planets or the outer planets?',
          zh: '在我们的太阳系中，先形成的是内行星还是外行星？'
        },
        options: [
          {
            en: 'The great heat of our Sun caused the inner planets to become fully formed while the outer planets were emerging from dust.',
            zh: '太阳的巨大热量使内行星先完全形成，而外行星仍在由尘埃中逐渐形成。'
          },
          {
            en: 'It is impossible to know for sure because we have not visited any of these planets yet.',
            zh: '我们无法确定，因为我们还没有访问过这些行星。'
          },
          {
            en: 'The "Frost Line" allowed the outer planets to cool, harden and form before the inner planets could take shape.',
            zh: '“霜线”使外行星先冷却、硬化并形成，而内行星后来才形成。'
          },
          {
            en: 'The inner and outer planets formed at the same time.',
            zh: '内行星和外行星是在同一时间形成的。'
          }
        ],
        answer: 0,
        explanation: {
          en: 'This page follows the provided answer key, which marks the inner planets as forming first.',
          zh: '本页按照你提供的答案键，将“内行星先形成”标记为正确答案。'
        }
      },
      {
        question: {
          en: 'Most of the light we see coming from the Sun originates in the',
          zh: '我们看到的太阳大部分光线起源于'
        },
        options: [
          { en: 'magnetic field', zh: '磁场' },
          { en: 'photosphere', zh: '光球层' },
          { en: 'chromosphere', zh: '色球层' },
          { en: 'sunspots', zh: '太阳黑子' },
          { en: 'corona', zh: '日冕' }
        ],
        answer: 1,
        explanation: {
          en: 'Most of the visible light from the Sun comes from the photosphere.',
          zh: '太阳的大部分可见光来自光球层。'
        }
      },
      {
        question: {
          en: 'The visible part of the Sun is called',
          zh: '太阳可见的部分称为'
        },
        options: [
          { en: 'the chromosphere', zh: '色球层' },
          { en: 'the photosphere', zh: '光球层' },
          { en: 'the corona', zh: '日冕' },
          { en: 'the surface', zh: '表面' }
        ],
        answer: 1,
        explanation: {
          en: 'The visible layer of the Sun is called the photosphere.',
          zh: '太阳可见的那一层称为光球层。'
        }
      },
      {
        question: {
          en: 'Which of the following describes the source of the Sun\'s energy?',
          zh: '以下哪一项描述了太阳能量的来源？'
        },
        options: [
          { en: 'radiation from the core', zh: '来自核心的辐射' },
          { en: 'radiation from the chromosphere', zh: '来自色球层的辐射' },
          { en: 'nuclear fusion in the core', zh: '核心中的核聚变' },
          { en: 'nuclear fusion in the corona', zh: '日冕中的核聚变' }
        ],
        answer: 2,
        explanation: {
          en: 'The Sun’s energy is produced by nuclear fusion in its core.',
          zh: '太阳的能量来自其核心中的核聚变。'
        }
      }
    ];

    const quizEl = document.getElementById('quiz');
    const scoreBox = document.getElementById('scoreBox');
    const languageMode = document.getElementById('languageMode');
    let lastAction = 'initial';
    let currentLanguageMode = 'en';

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getLocalizedHTML(text, stacked = true) {
      if (typeof text === 'string') return escapeHtml(text);
      if (currentLanguageMode === 'en') return escapeHtml(text.en);
      if (currentLanguageMode === 'zh') return escapeHtml(text.zh);
      const wrapperClass = stacked ? 'localized-text localized-stacked' : 'localized-text localized-inline';
      return `<span class="${wrapperClass}"><span class="lang-en">${escapeHtml(text.en)}</span><span class="lang-zh">${escapeHtml(text.zh)}</span></span>`;
    }

    function getLocalizedPlain(text) {
      if (typeof text === 'string') return text;
      if (currentLanguageMode === 'en') return text.en;
      return currentLanguageMode === 'zh' ? text.zh : `${text.en} / ${text.zh}`;
    }

    function getSelections() {
      return quizData.map((_, qIndex) => {
        const selected = document.querySelector(`input[name="question-${qIndex}"]:checked`);
        return selected ? selected.value : '';
      });
    }

    function renderLanguageOptions() {
      languageMode.innerHTML = languageOptions
        .map(option => `<option value="${option.value}">${escapeHtml(getLocalizedPlain(option.label))}</option>`)
        .join('');
      languageMode.value = currentLanguageMode;
    }

    function renderStaticText() {
      document.documentElement.lang = currentLanguageMode === 'zh' ? 'zh' : 'en';
      document.title = getLocalizedPlain(uiText.title);
      document.getElementById('heroTitle').innerHTML = getLocalizedHTML(uiText.title);
      document.getElementById('heroDescription').innerHTML = getLocalizedHTML(uiText.instructions);
      document.getElementById('submitBtn').innerHTML = getLocalizedHTML(uiText.gradeQuiz, false);
      document.getElementById('resetBtn').innerHTML = getLocalizedHTML(uiText.reset, false);
      document.getElementById('showBtn').innerHTML = getLocalizedHTML(uiText.showAnswers, false);
      document.getElementById('languageModeLabel').innerHTML = getLocalizedHTML(uiText.displayMode, false);
      document.getElementById('footerNote').innerHTML = getLocalizedHTML(uiText.footerTip);
      renderLanguageOptions();
    }

    function renderQuiz(selections = []) {
      quizEl.innerHTML = '';

      quizData.forEach((item, qIndex) => {
        const card = document.createElement('section');
        card.className = 'card question';
        card.id = `question-${qIndex}`;
        card.innerHTML = `
          <h2 class="question-title">${qIndex + 1}. ${getLocalizedHTML(item.question)}</h2>
          <div class="options"></div>
          <div class="feedback hidden" id="feedback-${qIndex}"></div>
        `;

        const optionsEl = card.querySelector('.options');

        item.options.forEach((option, oIndex) => {
          const optionLabel = document.createElement('label');
          optionLabel.className = 'option';
          optionLabel.innerHTML = `
            <input type="radio" name="question-${qIndex}" value="${oIndex}" ${String(selections[qIndex]) === String(oIndex) ? 'checked' : ''} />
            <span>${getLocalizedHTML(option)}</span>
          `;
          optionsEl.appendChild(optionLabel);
        });

        quizEl.appendChild(card);
      });
    }

    function updateScoreBox(score = 0, percent = 0) {
      if (lastAction === 'graded') {
        scoreBox.textContent = `${getLocalizedPlain(uiText.scoreLabel)}: ${score}/${quizData.length} (${percent}%)`;
        return;
      }

      if (lastAction === 'answers') {
        scoreBox.textContent = getLocalizedPlain(uiText.scoreAnswersDisplayed);
        return;
      }

      scoreBox.textContent = getLocalizedPlain(uiText.scoreNotGraded);
    }

    function gradeQuiz(showAnswers = false) {
      let score = 0;

      quizData.forEach((item, qIndex) => {
        const card = document.getElementById(`question-${qIndex}`);
        const allOptions = [...document.querySelectorAll(`input[name="question-${qIndex}"]`)];
        let selected = document.querySelector(`input[name="question-${qIndex}"]:checked`);
        const feedback = document.getElementById(`feedback-${qIndex}`);

        card.classList.remove('correct', 'incorrect');

        allOptions.forEach(input => {
          const wrapper = input.closest('.option');
          wrapper.style.borderColor = '';
          wrapper.style.background = '';
        });

        if (showAnswers) {
          allOptions.forEach((input, index) => {
            input.checked = index === item.answer;
          });
          selected = allOptions[item.answer];
        }

        if (selected) {
          const selectedIndex = Number(selected.value);
          if (selectedIndex === item.answer) {
            if (!showAnswers) score++;
            card.classList.add('correct');
            feedback.className = 'feedback correct';
            feedback.innerHTML = `${getLocalizedHTML(uiText.correct, false)}<div class="explanation">${getLocalizedHTML(item.explanation)}</div>`;
          } else {
            card.classList.add('incorrect');
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `${getLocalizedHTML(uiText.incorrect, false)}<div class="explanation">${getLocalizedHTML(uiText.correctAnswer, false)} <strong>${getLocalizedHTML(item.options[item.answer], false)}</strong><br>${getLocalizedHTML(item.explanation)}</div>`;
          }
        } else {
          feedback.className = 'feedback unanswered';
          feedback.innerHTML = `${getLocalizedHTML(uiText.notAnswered, false)}<div class="explanation">${getLocalizedHTML(uiText.correctAnswer, false)} <strong>${getLocalizedHTML(item.options[item.answer], false)}</strong><br>${getLocalizedHTML(item.explanation)}</div>`;
        }

        feedback.classList.remove('hidden');
      });

      const percent = Math.round((score / quizData.length) * 100);
      lastAction = showAnswers ? 'answers' : 'graded';
      updateScoreBox(score, percent);
    }

    function resetQuiz() {
      lastAction = 'initial';
      renderQuiz();
      updateScoreBox();
    }

    function setLanguageMode(mode) {
      const selections = getSelections();
      currentLanguageMode = mode;
      renderStaticText();
      renderQuiz(selections);

      if (lastAction === 'graded') {
        gradeQuiz(false);
      } else if (lastAction === 'answers') {
        gradeQuiz(true);
      } else {
        updateScoreBox();
      }
    }

    document.getElementById('submitBtn').addEventListener('click', () => gradeQuiz(false));
    document.getElementById('showBtn').addEventListener('click', () => gradeQuiz(true));
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);
    languageMode.addEventListener('change', event => setLanguageMode(event.target.value));

    renderStaticText();
    renderQuiz();
    updateScoreBox();
  </script>
</body>
</html>
