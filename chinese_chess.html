<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chinese Chess (Xiangqi) vs AI</title>
  <style>
    :root{
      --bg0:#0b1220;
      --bg1:#0f1a2e;
      --card: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.14);
      --ink:#eaf0ff;
      --muted: rgba(234,240,255,.72);
      --good:#7ef0c2;
      --warn:#ffdd7a;
      --bad:#ff7a7a;
      --accent:#7aa2ff;

      --boardLight: #f1e7d3;
      --boardDark: #a88258;
      --boardLight2: #f6efdf;
      --boardDark2: #b58b61;
      --shadow: 0 16px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--ink);
      font-family:var(--sans);
      background:
        radial-gradient(900px 600px at 10% 0%, rgba(122,162,255,.22), transparent 60%),
        radial-gradient(800px 520px at 92% 12%, rgba(126,240,194,.16), transparent 55%),
        radial-gradient(700px 520px at 60% 90%, rgba(255,221,122,.10), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,18,32,.92), rgba(11,18,32,.55));
      border-bottom: 1px solid var(--line);
    }

    .topbar{
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }

    .brand{ display:flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .brand h1{ margin:0; font-family: var(--serif); font-size: 18px; letter-spacing: .02em; }

    .actions{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      cursor:pointer;
      transition: transform .08s ease, background .12s ease;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ border-color: rgba(122,162,255,.45); background: rgba(122,162,255,.14); }
    .btn.primary:hover{ background: rgba(122,162,255,.20); }
    .btn.danger{ border-color: rgba(255,122,122,.55); background: rgba(255,122,122,.12); }

    main{ max-width: 1180px; margin: 0 auto; padding: 16px 14px 42px; }
    .layout{ display:grid; grid-template-columns: 520px 1fr; gap: 16px; align-items: start; }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .head{
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, rgba(122,162,255,.12), rgba(255,255,255,0));
    }
    .card .head .title{ font-weight: 800; letter-spacing: .02em; }
    .card .body{ padding: 14px; }
    .boardWrap{ padding: 14px; }

    .board{
      width: 100%;
      aspect-ratio: 9 / 10;
      position: relative;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(0,0,0,.35);
      box-shadow: 0 18px 48px rgba(0,0,0,.35);
      display:grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    .sq{
      position: relative;
      display:grid;
      place-items: center;
      width: 100%;
      height: 100%;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .sq.light{ background: linear-gradient(180deg, var(--boardLight2), var(--boardLight)); }
    .sq.dark{ background: linear-gradient(180deg, var(--boardDark2), var(--boardDark)); }

    .sq.river{
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.05)),
        repeating-linear-gradient(90deg, rgba(0,0,0,.12), rgba(0,0,0,.12) 10px, rgba(0,0,0,.06) 10px, rgba(0,0,0,.06) 20px),
        linear-gradient(180deg, var(--boardLight2), var(--boardLight));
    }

    .pieceToken{
      width: min(46px, 86%);
      aspect-ratio: 1 / 1;
      border-radius: 999px;
      display:grid;
      place-items:center;
      font-weight: 900;
      font-family: var(--serif);
      font-size: clamp(18px, 4.4vw, 26px);
      letter-spacing: .06em;
      box-shadow:
        0 10px 24px rgba(0,0,0,.28),
        0 0 0 1px rgba(0,0,0,.55) inset,
        0 1px 0 rgba(255,255,255,.18) inset;
    }
    .pieceToken.red{
      color: rgba(150, 10, 10, .95);
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.92), rgba(245,236,220,.90) 55%, rgba(210, 165, 125, .90));
      border: 2px solid rgba(150, 10, 10, .55);
    }
    .pieceToken.black{
      color: rgba(18,18,18,.94);
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.92), rgba(240,232,218,.88) 55%, rgba(185, 140, 98, .90));
      border: 2px solid rgba(0,0,0,.55);
    }

    .sq .coord{
      position:absolute;
      left:6px;
      bottom:4px;
      font-size: 11px;
      font-family: var(--mono);
      opacity: .65;
      color: rgba(0,0,0,.60);
      text-shadow: 0 1px 0 rgba(255,255,255,.18);
      pointer-events:none;
    }
    .sq.sel{ outline: 3px solid rgba(122,162,255,.95); outline-offset: -3px; }
    .sq.legal{ box-shadow: inset 0 0 0 3px rgba(126,240,194,.85); }
    .sq.capture::after{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: 999px;
      border: 3px solid rgba(255,122,122,.75);
      box-shadow: 0 0 0 2px rgba(0,0,0,.18) inset;
      pointer-events:none;
    }
    .sq.legal::before{
      content:"";
      position:absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(126,240,194,.75);
      box-shadow: 0 0 0 2px rgba(0,0,0,.20);
      pointer-events:none;
    }
    .sq.capture.legal::before{ display:none; }

    .sq.lastFlash{ animation: lastPulse 1.1s ease-in-out infinite; }
    @keyframes lastPulse{
      0%, 100%{
        box-shadow:
          inset 0 0 0 1px rgba(0,0,0,.55),
          inset 0 0 0 3px rgba(255,229,140,.55),
          0 12px 28px rgba(0,0,0,.22),
          0 0 0 2px rgba(255,229,140,.22);
      }
      50%{
        box-shadow:
          inset 0 0 0 1px rgba(0,0,0,.68),
          inset 0 0 0 3px rgba(255,229,140,.92),
          0 16px 40px rgba(0,0,0,.34),
          0 0 0 4px rgba(255,229,140,.30);
      }
    }

    @media (prefers-reduced-motion: reduce){
      .sq.lastFlash{ animation: none; }
      .sq.flash::after{ animation: none; opacity: .65; }
      .moveGhost{ transition: none !important; }
    }

    .sq.flash::after{
      content:"";
      position:absolute;
      inset: 0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,229,140,.62), rgba(255,229,140,0) 62%),
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
      animation: destFlash 2s ease-out forwards;
      mix-blend-mode: screen;
    }
    @keyframes destFlash{
      0%{ opacity: 0; transform: scale(.98); }
      20%{ opacity: .95; transform: scale(1.00); }
      100%{ opacity: 0; transform: scale(1.06); }
    }

    .moveGhost{
      position:absolute;
      display:grid;
      place-items:center;
      left:0;
      top:0;
      width: 0;
      height: 0;
      line-height: 1;
      transform: translate(0px, 0px);
      transition: transform 180ms cubic-bezier(.22, .75, .22, 1);
      pointer-events:none;
      z-index: 5;
    }
    .moveGhost .pieceToken{ width: 88%; }

    .statusRow{ display:flex; gap:10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
    }
    .pill.good{ border-color: rgba(126,240,194,.40); }
    .pill.warn{ border-color: rgba(255,221,122,.45); }
    .pill.bad{ border-color: rgba(255,122,122,.55); }

    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
    label{
      display:block;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(234,240,255,.70);
      margin: 0 0 6px;
    }
    input[type="text"], select{
      width:100%;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.20);
      color: var(--ink);
      outline:none;
    }
    input[type="text"]:focus, select:focus{ border-color: rgba(122,162,255,.65); box-shadow: 0 0 0 4px rgba(122,162,255,.14); }
    .muted{ color: var(--muted); font-size: 13px; line-height: 1.35; }
    .small{ font-size: 12px; color: rgba(234,240,255,.64); }
    .movelist{
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      max-height: 260px;
      overflow:auto;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
    }
    details{
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      background: rgba(0,0,0,.18);
      overflow:hidden;
    }
    summary{ cursor:pointer; padding: 10px 12px; font-weight: 800; list-style:none; user-select:none; }
    summary::-webkit-details-marker{display:none}
    details[open] summary{ border-bottom: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
    pre{
      margin:0;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(234,240,255,.86);
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>Chinese Chess (Xiangqi) vs AI</h1>
      </div>
      <div class="actions">
        <button class="btn" id="btn-undo" type="button">Undo</button>
        <button class="btn" id="btn-flip" type="button">Flip</button>
        <button class="btn danger" id="btn-new" type="button">New Game</button>
      </div>
    </div>
  </header>

  <main>
    <div class="layout">
      <section class="card">
        <div class="head">
          <div>
            <div class="title">Board</div>
            <div class="statusRow" style="margin-top:6px">
              <span class="pill" id="pill-turn">turn: r</span>
              <span class="pill" id="pill-you">you: red</span>
              <span class="pill" id="pill-state">ready</span>
              <span class="pill" id="clock-turn">r 00:00</span>
            </div>
          </div>
          <div class="small" id="status-text">Your move.</div>
        </div>
        <div class="boardWrap">
          <div class="board" id="board" aria-label="Xiangqi board"></div>
        </div>
      </section>

      <aside class="card">
        <div class="head">
          <div class="title">Game &amp; Engine</div>
          <div class="small" id="meta-state"></div>
        </div>
        <div class="body">
          <div class="grid">
            <div>
              <label for="select-side">Play as</label>
              <select id="select-side">
                <option value="r" selected>Red (default)</option>
                <option value="b">Black</option>
              </select>
            </div>
            <div>
              <label for="input-endpoint">AI endpoint</label>
              <input id="input-endpoint" type="text" spellcheck="false" value="https://lakesideart.gochatus.org/grade-service/general" />
            </div>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center">
            <button class="btn primary" id="btn-ai-move" type="button">Ask AI To Move</button>
            <button class="btn" id="btn-autoplay" type="button">Auto Play</button>
            <button class="btn" id="btn-test" type="button">Test Endpoint</button>
            <span class="muted" id="api-status"></span>
          </div>

          <div style="margin-top:14px">
            <label>Moves</label>
            <div class="movelist" id="movelist" aria-label="Move list"></div>
          </div>

          <div style="margin-top:14px">
            <details id="details-debug">
              <summary>Debug (State + AI raw)</summary>
              <pre id="debug"></pre>
            </details>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script type="module">
    import { Xiangqi } from './assets/xiangqi.js';

    const DEFAULT_ENDPOINT = 'https://lakesideart.gochatus.org/grade-service/general';

    const boardEl = document.getElementById('board');
    const movelistEl = document.getElementById('movelist');
    const statusTextEl = document.getElementById('status-text');
    const pillTurnEl = document.getElementById('pill-turn');
    const pillYouEl = document.getElementById('pill-you');
    const pillStateEl = document.getElementById('pill-state');
    const metaStateEl = document.getElementById('meta-state');
    const debugEl = document.getElementById('debug');
    const apiStatusEl = document.getElementById('api-status');
    const clockTurnEl = document.getElementById('clock-turn');

    const btnUndo = document.getElementById('btn-undo');
    const btnFlip = document.getElementById('btn-flip');
    const btnNew = document.getElementById('btn-new');
    const btnAiMove = document.getElementById('btn-ai-move');
    const btnAutoplay = document.getElementById('btn-autoplay');
    const btnTest = document.getElementById('btn-test');

    const selectSideEl = document.getElementById('select-side');
    const endpointEl = document.getElementById('input-endpoint');

    const PIECE_LABEL = {
      rr: '车', rn: '马', re: '相', ra: '仕', rk: '帅', rc: '炮', rp: '兵',
      br: '车', bn: '马', be: '象', ba: '士', bk: '将', bc: '炮', bp: '卒'
    };

    function safeText(v) {
      return (v === null || v === undefined) ? '' : String(v);
    }

    function fmtClock(ms) {
      const clamped = Math.max(0, Math.floor(ms));
      const totalSec = Math.floor(clamped / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      if (h > 0) return `${h}:${mm}:${ss}`;
      return `${mm}:${ss}`;
    }

    let animating = false;
    let activeMoveAnim = null; // { from, to, pieceCode }
    let lastFlashSquare = null;

    let clockTurnStartMs = performance.now();
    let clockTicker = null;

    function resetTurnClock() {
      clockTurnStartMs = performance.now();
      renderTurnClock();
    }

    function startTurnClockTicker() {
      if (clockTicker) return;
      clockTicker = window.setInterval(() => {
        renderTurnClock();
      }, 200);
    }

    function renderTurnClock() {
      if (!clockTurnEl) return;
      let elapsed = 0;
      if (game && typeof game.isGameOver === 'function' && !game.isGameOver()) {
        elapsed = Math.max(0, performance.now() - clockTurnStartMs);
      }
      const turnChar = (game && typeof game.turn === 'function') ? game.turn() : 'r';
      clockTurnEl.textContent = `${turnChar} ${fmtClock(elapsed)}`;
    }

    function getSquareEl(square) {
      return boardEl.querySelector(`[data-square="${square}"]`);
    }

    function clearPersistentFlash() {
      if (!lastFlashSquare) return;
      const prev = getSquareEl(lastFlashSquare);
      if (prev) prev.classList.remove('lastFlash');
      lastFlashSquare = null;
    }

    function setPersistentFlash(square) {
      if (!square) return;
      if (lastFlashSquare && lastFlashSquare !== square) {
        const prev = getSquareEl(lastFlashSquare);
        if (prev) prev.classList.remove('lastFlash');
      }
      lastFlashSquare = square;
      const el = getSquareEl(square);
      if (el) el.classList.add('lastFlash');
    }

    function flashDestination(square) {
      setPersistentFlash(square);
      const el = getSquareEl(square);
      if (!el) return;
      el.classList.remove('flash');
      // eslint-disable-next-line no-unused-expressions
      el.offsetWidth;
      el.classList.add('flash');
      window.setTimeout(() => {
        const now = getSquareEl(square);
        if (now) now.classList.remove('flash');
      }, 2100);
    }

    function makeToken(code) {
      const d = document.createElement('div');
      d.className = `pieceToken ${code[0] === 'r' ? 'red' : 'black'}`;
      d.textContent = PIECE_LABEL[code] || '?';
      return d;
    }

    function playMoveAnimation(anim) {
      if (!anim || !anim.from || !anim.to || !anim.pieceCode) return Promise.resolve();
      clearPersistentFlash();

      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return Promise.resolve();

      const fromEl = getSquareEl(anim.from);
      const toEl = getSquareEl(anim.to);
      if (!fromEl || !toEl) return Promise.resolve();

      const boardRect = boardEl.getBoundingClientRect();
      const fr = fromEl.getBoundingClientRect();
      const tr = toEl.getBoundingClientRect();
      const dx = tr.left - fr.left;
      const dy = tr.top - fr.top;

      const ghost = document.createElement('div');
      ghost.className = 'moveGhost';
      ghost.style.left = `${fr.left - boardRect.left}px`;
      ghost.style.top = `${fr.top - boardRect.top}px`;
      ghost.style.width = `${fr.width}px`;
      ghost.style.height = `${fr.height}px`;
      ghost.appendChild(makeToken(anim.pieceCode));

      animating = true;
      boardEl.appendChild(ghost);

      return new Promise((resolve) => {
        const finish = () => {
          ghost.remove();
          animating = false;
          resolve();
        };

        const onEnd = (e) => {
          if (e && e.propertyName && e.propertyName !== 'transform') return;
          ghost.removeEventListener('transitionend', onEnd);
          finish();
        };
        ghost.addEventListener('transitionend', onEnd);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transform = `translate(${dx}px, ${dy}px)`;
          });
        });

        window.setTimeout(() => {
          if (document.body.contains(ghost)) {
            ghost.removeEventListener('transitionend', onEnd);
            finish();
          }
        }, 350);
      });
    }

    function setPill(el, text, kind) {
      el.textContent = text;
      el.classList.remove('good','warn','bad');
      if (kind) el.classList.add(kind);
    }

    function squareToCoords(square) {
      const file = square.charCodeAt(0) - 97;
      const rank = Number(square[1]);
      return { file, rank };
    }

    function coordsToSquare(file, rank) {
      return String.fromCharCode(97 + file) + String(rank);
    }

    function fmtHistory(game) {
      const hist = game.history({ verbose: true });
      if (!hist.length) return '—';
      const parts = [];
      for (let i = 0; i < hist.length; i++) {
        const mv = hist[i];
        const token = `${mv.from}${mv.captured ? 'x' : '-'}${mv.to}`;
        if (mv.color === 'r') {
          const moveNo = Math.floor(i / 2) + 1;
          parts.push(`${moveNo}. ${token}`);
        } else {
          parts.push(token);
        }
      }
      return parts.join(' ');
    }

    function isUserTurn(game, humanColor) {
      return game.turn() === humanColor;
    }

    function gameStatusText(game) {
      if (game.isCheckmate && game.isCheckmate()) return 'Checkmate.';
      if (game.isStalemate && game.isStalemate()) return 'Stalemate.';
      if (game.isCheck && game.isCheck()) return 'Check.';
      return '—';
    }

    let game = new Xiangqi();
    let humanColor = 'r';
    let flipped = false;
    let busy = false;

    let autoplayEnabled = false;
    let autoplayDelayMs = 450;
    let autoplayTimer = null;
    let autoplayToken = 0;

    let selectedSquare = null;
    let legalToSquares = new Set();
    let legalCaptureSquares = new Set();

    function renderAutoplayButton() {
      if (!btnAutoplay) return;
      btnAutoplay.textContent = autoplayEnabled ? 'Stop Auto Play' : 'Auto Play';
      btnAutoplay.classList.toggle('danger', autoplayEnabled);
    }

    function stopAutoplay(message) {
      autoplayEnabled = false;
      autoplayToken++;
      if (autoplayTimer) {
        window.clearTimeout(autoplayTimer);
        autoplayTimer = null;
      }
      if (message) setApiStatus(message, 'warn');
      renderAutoplayButton();
      renderMeta();
    }

    function scheduleAutoplayTick(token, delayMs) {
      if (autoplayTimer) window.clearTimeout(autoplayTimer);
      autoplayTimer = window.setTimeout(() => autoplayTick(token), Math.max(0, delayMs || 0));
    }

    async function autoplayTick(token) {
      if (!autoplayEnabled) return;
      if (token !== autoplayToken) return;

      if (game.isGameOver && game.isGameOver()) {
        stopAutoplay('Auto play stopped (game over).');
        renderAll();
        return;
      }

      if (busy || animating) {
        scheduleAutoplayTick(token, 160);
        return;
      }

      const moved = await askAiForMove({ force: true });
      if (!autoplayEnabled || token !== autoplayToken) return;
      if (!moved) {
        stopAutoplay('Auto play stopped (AI error).');
        return;
      }

      scheduleAutoplayTick(token, autoplayDelayMs);
    }

    function startAutoplay() {
      if (autoplayEnabled) return;
      autoplayEnabled = true;
      autoplayToken++;
      setApiStatus('Auto play on (AI vs AI).', 'good');
      renderAutoplayButton();
      renderMeta();
      scheduleAutoplayTick(autoplayToken, 50);
    }

    function toggleAutoplay() {
      if (autoplayEnabled) stopAutoplay('Auto play off.');
      else startAutoplay();
    }

    function currentStateJson() {
      return game.state();
    }

    function updateDebug(extra) {
      const state = currentStateJson();
      const payload = {
        state,
        ...extra
      };
      debugEl.textContent = JSON.stringify(payload, null, 2);
    }

    function renderMeta() {
      const t = game.turn();
      pillTurnEl.textContent = `turn: ${t}`;
      pillYouEl.textContent = `you: ${humanColor === 'r' ? 'red' : 'black'}`;
      metaStateEl.textContent = gameStatusText(game);

      if (busy) {
        setPill(pillStateEl, 'thinking…', 'warn');
      } else if (game.isGameOver && game.isGameOver()) {
        setPill(pillStateEl, 'game over', 'bad');
      } else if (autoplayEnabled) {
        setPill(pillStateEl, 'autoplay', 'warn');
      } else {
        setPill(
          pillStateEl,
          isUserTurn(game, humanColor) ? 'your move' : 'ai move',
          isUserTurn(game, humanColor) ? 'good' : 'warn'
        );
      }

      if (game.isGameOver && game.isGameOver()) {
        statusTextEl.textContent = gameStatusText(game);
      } else if (autoplayEnabled) {
        statusTextEl.textContent = 'Auto-playing (AI vs AI)…';
      } else {
        statusTextEl.textContent = isUserTurn(game, humanColor) ? 'Your move.' : 'AI to move.';
      }
    }

    function clearHighlights() {
      selectedSquare = null;
      legalToSquares = new Set();
      legalCaptureSquares = new Set();
    }

    function displayedSquares() {
      // rank 0..9
      const squares = [];
      if (!flipped) {
        for (let rank = 0; rank <= 9; rank++) {
          for (let file = 0; file < 9; file++) {
            squares.push(coordsToSquare(file, rank));
          }
        }
      } else {
        for (let rank = 9; rank >= 0; rank--) {
          for (let file = 8; file >= 0; file--) {
            squares.push(coordsToSquare(file, rank));
          }
        }
      }
      return squares;
    }

    function squareIsDark(square) {
      const { file, rank } = squareToCoords(square);
      return (file + rank) % 2 === 0;
    }

    function squareIsRiver(square) {
      const { rank } = squareToCoords(square);
      // Decorative: river in the middle between ranks 4 and 5.
      return rank === 4 || rank === 5;
    }

    function coordLabelForSquare(square) {
      const { file, rank } = squareToCoords(square);
      // show file labels on bottom edge and rank labels on left edge (relative to orientation)
      if (!flipped) {
        const showFile = (rank === 9);
        const showRank = (file === 0);
        if (!showFile && !showRank) return '';
        let out = '';
        if (showFile) out += String.fromCharCode(97 + file);
        if (showRank) out += String(rank);
        return out;
      }
      // flipped: bottom edge is rank 0, left edge is file 8
      const showFile = (rank === 0);
      const showRank = (file === 8);
      if (!showFile && !showRank) return '';
      let out = '';
      if (showFile) out += String.fromCharCode(97 + file);
      if (showRank) out += String(rank);
      return out;
    }

    function renderBoard() {
      const squares = displayedSquares();
      boardEl.innerHTML = '';

      for (const sq of squares) {
        const el = document.createElement('div');
        const dark = squareIsDark(sq);
        el.className = 'sq ' + (dark ? 'dark' : 'light');
        if (squareIsRiver(sq) && !dark) el.classList.add('river');
        el.dataset.square = sq;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', sq);

        const code = game.get(sq);
        const suppress = activeMoveAnim && activeMoveAnim.to === sq;
        if (code && !suppress) {
          el.appendChild(makeToken(code));
        }

        const coord = coordLabelForSquare(sq);
        if (coord) {
          const c = document.createElement('div');
          c.className = 'coord';
          c.textContent = coord;
          el.appendChild(c);
        }

        if (selectedSquare === sq) el.classList.add('sel');
        if (legalToSquares.has(sq)) el.classList.add('legal');
        if (legalCaptureSquares.has(sq)) el.classList.add('capture');
        if (lastFlashSquare === sq) el.classList.add('lastFlash');

        el.addEventListener('click', () => onSquareClick(sq));
        boardEl.appendChild(el);
      }
    }

    function renderMoves() {
      movelistEl.textContent = fmtHistory(game);
    }

    function renderAll(extraDebug) {
      renderMeta();
      renderBoard();
      renderMoves();
      updateDebug(extraDebug || {});
    }

    function syncBoardSize() {
      // 9x10 grid: snap width to 9px multiple and compute height.
      const w = boardEl.getBoundingClientRect().width;
      if (w && Number.isFinite(w)) {
        // Keep width responsive; only set height.
        const cell = Math.max(8, Math.floor(w / 9));
        const height = cell * 10;
        boardEl.style.height = `${height}px`;
      }
    }

    function setApiStatus(text, kind) {
      apiStatusEl.textContent = safeText(text);
      apiStatusEl.style.color = kind === 'good' ? 'var(--good)' : (kind === 'bad' ? 'var(--bad)' : 'var(--muted)');
    }

    function computeLegalTargets(from) {
      const moves = game.moves({ square: from, verbose: true });
      const toSquares = new Set();
      const captureSquares = new Set();
      for (const mv of moves) {
        toSquares.add(mv.to);
        if (mv.flags && mv.flags.includes('c')) captureSquares.add(mv.to);
      }
      return { toSquares, captureSquares };
    }

    function onSquareClick(square) {
      if (busy || animating) return;
      if (game.isGameOver && game.isGameOver()) return;
      if (autoplayEnabled) {
        setApiStatus('Stop Auto Play to make moves.', 'warn');
        return;
      }
      if (!isUserTurn(game, humanColor)) return;

      const clickedPiece = game.get(square);

      if (!selectedSquare) {
        if (!clickedPiece) return;
        if (clickedPiece[0] !== humanColor) return;

        selectedSquare = square;
        const { toSquares, captureSquares } = computeLegalTargets(square);
        legalToSquares = toSquares;
        legalCaptureSquares = captureSquares;
        renderBoard();
        return;
      }

      if (square === selectedSquare) {
        clearHighlights();
        renderBoard();
        return;
      }

      if (clickedPiece && clickedPiece[0] === humanColor) {
        selectedSquare = square;
        const { toSquares, captureSquares } = computeLegalTargets(square);
        legalToSquares = toSquares;
        legalCaptureSquares = captureSquares;
        renderBoard();
        return;
      }

      if (!legalToSquares.has(square)) return;
      const from = selectedSquare;
      const to = square;
      tryUserMove(from, to);
    }

    async function tryUserMove(from, to) {
      if (animating) return;
      const moving = game.get(from);
      if (!moving) return;

      try {
        game.move({ from, to });
        activeMoveAnim = { from, to, pieceCode: moving };
      } catch (e) {
        setApiStatus(`Illegal move: ${from}-${to}`, 'bad');
        return;
      }

      clearHighlights();
      renderAll();

      const anim = activeMoveAnim;
      await playMoveAnimation(anim);
      activeMoveAnim = null;
      renderBoard();
      flashDestination(to);
      resetTurnClock();

      await maybeAiMove();
    }

    function extractJsonFromText(text) {
      const stripped = String(text || '').trim();
      if (!stripped) return null;
      try {
        return JSON.parse(stripped);
      } catch {}
      const fence = stripped.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      if (fence && fence[1]) {
        try {
          return JSON.parse(fence[1].trim());
        } catch {}
      }
      const start = stripped.indexOf('{');
      const end = stripped.lastIndexOf('}');
      if (start !== -1 && end !== -1 && end > start) {
        const candidate = stripped.slice(start, end + 1);
        try {
          return JSON.parse(candidate);
        } catch {}
      }
      return null;
    }

    function buildEnginePrompt(state) {
      const instructions = [
        'You are a Xiangqi (Chinese chess) engine. I will send you the current position as JSON.',
        '',
        'Your job:',
        '1) Decide the best LEGAL move for the current player.',
        '2) Output ONLY valid JSON (no explanation, no markdown).',
        '',
        'Output format:',
        '{',
        '  "move": { "from": "<square>", "to": "<square>" },',
        '  "updated_state": {',
        '    "turn": "red" | "black",',
        '    "board": [10 x 9 array]',
        '  }',
        '}',
        '',
        'Coordinate system:',
        '- Squares are like "a0".."i9" where a..i are files (left to right) and 0..9 are ranks (top to bottom).',
        '- board[0] is the TOP row (rank 0), board[9] is the BOTTOM row (rank 9).',
        '',
        'Piece codes:',
        '- Red: rr rn re ra rk rc rp',
        '- Black: br bn be ba bk bc bp',
        '',
        'Rules reminders (must be legal):',
        '- Cannon captures need exactly ONE screen piece; non-captures move like rook.',
        '- Horse has a "leg" block. Elephant has an "eye" block and cannot cross river.',
        '- Advisors + King stay inside the palace. Kings cannot face each other with no pieces between.',
        '- Pawns move forward; after crossing river they may move sideways (never backward).',
        '',
        'Current position JSON:',
        JSON.stringify(state, null, 2)
      ].join('\n');
      return instructions;
    }

    async function fetchJsonWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const resp = await fetch(url, { ...options, signal: controller.signal });
        const text = await resp.text().catch(() => '');
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = null;
        }
        return { ok: resp.ok, status: resp.status, data, text };
      } catch (err) {
        if (err && err.name === 'AbortError') {
          return { ok: false, status: 0, data: null, text: '', aborted: true };
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    async function askAiForMove({ force = false } = {}) {
      if (busy) return false;
      if (animating) return false;
      if (game.isGameOver && game.isGameOver()) return false;
      if (!force && isUserTurn(game, humanColor)) return false;

      const endpoint = (endpointEl.value || '').trim() || DEFAULT_ENDPOINT;

      busy = true;
      setApiStatus('Calling AI…');
      renderMeta();

      const state = currentStateJson();
      const prompt = buildEnginePrompt(state);
      const reqBody = { message: prompt };

      const aiTimeoutMs = 180000;
      let rawResponseText = '';
      let parsed = null;
      let envelope = null;
      let moved = false;

      try {
        const { ok, status, data, text, aborted } = await fetchJsonWithTimeout(
          endpoint,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reqBody)
          },
          aiTimeoutMs
        );

        if (aborted) throw new Error(`timeout_after_${Math.round(aiTimeoutMs / 1000)}s`);
        if (!ok) throw new Error(`http_${status}`);
        envelope = data;
        rawResponseText = data && data.response !== undefined ? data.response : text;

        if (rawResponseText && typeof rawResponseText === 'object') {
          parsed = rawResponseText;
        } else {
          parsed = extractJsonFromText(rawResponseText);
        }

        if (!parsed || typeof parsed !== 'object' || !parsed.move) {
          throw new Error('ai_non_json_or_missing_move');
        }

        const moveFrom = parsed.move.from;
        const moveTo = parsed.move.to;
        if (!moveFrom || !moveTo) throw new Error('ai_missing_from_to');

        const moving = game.get(moveFrom);
        game.move({ from: moveFrom, to: moveTo });
        activeMoveAnim = { from: moveFrom, to: moveTo, pieceCode: moving || 'rp' };
        moved = true;

        setApiStatus(`AI played: ${moveFrom}-${moveTo}`, 'good');
        clearHighlights();
        renderAll({
          ai_request: reqBody,
          ai_envelope: envelope,
          ai_parsed: parsed
        });

        const anim = activeMoveAnim;
        await playMoveAnimation(anim);
        activeMoveAnim = null;
        renderBoard();
        flashDestination(moveTo);
        resetTurnClock();
      } catch (err) {
        console.warn('AI move failed:', err);
        setApiStatus(`AI error: ${safeText(err && err.message ? err.message : err)}`, 'bad');
        renderAll({
          ai_request: reqBody,
          ai_envelope: envelope,
          ai_raw: rawResponseText,
          ai_parsed: parsed
        });
      } finally {
        busy = false;
        renderMeta();
      }
      return moved;
    }

    async function maybeAiMove() {
      if (game.isGameOver && game.isGameOver()) {
        renderAll();
        return;
      }
      if (!isUserTurn(game, humanColor)) {
        await askAiForMove();
      }
    }

    async function testEndpoint() {
      const endpoint = (endpointEl.value || '').trim() || DEFAULT_ENDPOINT;
      setApiStatus('Testing…');
      try {
        const { ok, status, data, aborted } = await fetchJsonWithTimeout(
          endpoint,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Return ONLY JSON: {"ok":true}' })
          },
          8000
        );
        if (aborted) {
          setApiStatus('Test timeout (8s).', 'bad');
          return;
        }
        if (!ok) {
          setApiStatus(`HTTP ${status} (may still be reachable).`, 'bad');
          return;
        }
        if (!data || data.response === undefined) {
          setApiStatus('Endpoint responded, but missing {response:...}.', 'bad');
          return;
        }
        setApiStatus('Endpoint OK (got a response).', 'good');
      } catch (e) {
        setApiStatus('Could not reach endpoint (CORS/offline).', 'bad');
      }
    }

    function newGame() {
      game = new Xiangqi();
      clearHighlights();
      lastFlashSquare = null;
      busy = false;

      resetTurnClock();
      startTurnClockTicker();

      flipped = (humanColor === 'b');

      renderAll();
      syncBoardSize();
      if (autoplayEnabled) {
        scheduleAutoplayTick(autoplayToken, 50);
      } else {
        maybeAiMove();
      }
    }

    btnNew.addEventListener('click', () => newGame());

    btnFlip.addEventListener('click', () => {
      if (animating) return;
      flipped = !flipped;
      renderBoard();
    });

    btnUndo.addEventListener('click', () => {
      if (busy || animating) return;
      if (autoplayEnabled) stopAutoplay('Auto play stopped (undo).');
      const m1 = game.undo();
      const m2 = game.undo();
      if (!m1 && !m2) {
        setApiStatus('Nothing to undo.', 'warn');
      } else {
        setApiStatus('Undid last moves.', 'good');
      }
      lastFlashSquare = null;
      resetTurnClock();
      clearHighlights();
      renderAll();
    });

    btnAiMove.addEventListener('click', () => {
      if (animating) return;
      askAiForMove({ force: true });
    });
    btnAutoplay.addEventListener('click', () => {
      if (animating) return;
      toggleAutoplay();
    });
    btnTest.addEventListener('click', () => {
      if (animating) return;
      testEndpoint();
    });

    selectSideEl.addEventListener('change', () => {
      if (animating) return;
      humanColor = selectSideEl.value === 'b' ? 'b' : 'r';
      newGame();
    });

    endpointEl.addEventListener('change', () => {
      if (!(endpointEl.value || '').trim()) endpointEl.value = DEFAULT_ENDPOINT;
      setApiStatus('');
    });

    // init
    endpointEl.value = (endpointEl.value || '').trim() || DEFAULT_ENDPOINT;
    humanColor = selectSideEl.value === 'b' ? 'b' : 'r';
    flipped = (humanColor === 'b');
    renderAutoplayButton();
    resetTurnClock();
    startTurnClockTicker();
    renderAll();
    syncBoardSize();
    window.addEventListener('resize', () => syncBoardSize());
  </script>
</body>
</html>
