<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflect & Check for Understanding</title>
  <style>
    :root {
      --gold: #f1cf33;
      --panel: rgba(56, 56, 56, 0.92);
      --light: #efefef;
      --outline: #52586c;
      --blue: #9fd4e8;
      --red: #dd6a61;
      --text: #111;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Trebuchet MS", "Avenir Next", Arial, sans-serif;
      overflow: hidden;
      background: #d9d9d9;
    }

    body {
      position: relative;
      color: var(--text);
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)),
        radial-gradient(circle at 48% 8%, rgba(255,255,255,0.95), rgba(255,255,255,0.05) 18%, transparent 40%),
        linear-gradient(180deg, #919191 0%, #818181 18%, #696969 45%, #535353 68%, #3f3f3f 100%);
      filter: grayscale(100%);
    }

    .bg::before,
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bg::before {
      background:
        radial-gradient(ellipse at 22% 72%, rgba(0,0,0,0.85) 0 7%, transparent 7.5%),
        radial-gradient(ellipse at 82% 60%, rgba(0,0,0,0.78) 0 8%, transparent 8.5%),
        linear-gradient(180deg, transparent 58%, rgba(0,0,0,0.75) 58.4%, rgba(255,255,255,0.08) 58.8%, transparent 59.4%),
        linear-gradient(90deg, transparent 0 19%, rgba(255,255,255,0.04) 19.3%, transparent 20%);
      opacity: 0.95;
    }

    .bg::after {
      background:
        linear-gradient(180deg, transparent 0 54%, rgba(255,255,255,0.18) 54.3%, transparent 54.7%),
        linear-gradient(0deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      mix-blend-mode: screen;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
    }

    .screen.active { display: block; }

    .speed-badge {
      position: absolute;
      top: 22px;
      left: 24px;
      background: #000;
      color: #fff;
      border-radius: 12px;
      padding: 18px 22px;
      font-size: 26px;
      line-height: 1;
      z-index: 4;
      min-width: 96px;
      text-align: center;
    }

    .start-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 4vh 4vw;
      color: #f4ef8d;
      text-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .start-inner {
      width: min(92vw, 1350px);
      transform: translateY(-2vh);
    }

    .title {
      font-size: clamp(58px, 8vw, 128px);
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.08;
      margin-bottom: 28px;
    }

    .start-btn {
      margin: 24px auto 18px;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(54vw, 510px);
      height: min(13vw, 118px);
      border-radius: 38px;
      background: #efc658;
      color: #fff;
      font-weight: 800;
      font-size: clamp(34px, 5vw, 72px);
      box-shadow: inset 0 3px 0 rgba(255,255,255,0.45), 0 6px 0 rgba(0,0,0,0.18), 0 18px 30px rgba(0,0,0,0.18);
    }

    .wcln-logo {
      width: min(28vw, 420px);
      margin: 20px auto 0;
      color: #222;
      text-shadow: none;
    }

    .wcln-mark {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 2px;
      transform: translateX(34px);
    }

    .star-person {
      width: 34px;
      height: 34px;
      position: relative;
      clip-path: polygon(50% 0%, 62% 35%, 100% 35%, 69% 57%, 80% 100%, 50% 72%, 20% 100%, 31% 57%, 0 35%, 38% 35%);
    }

    .star-person::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: currentColor;
      left: 50%;
      top: -6px;
      transform: translateX(-50%);
    }

    .red { color: #df342d; background: #df342d; }
    .white { color: #fff; background: #fff; }
    .blue { color: #2148c7; background: #2148c7; }
    .yellow { color: #f3d628; background: #f3d628; }

    .wcln-text {
      font-size: clamp(34px, 5vw, 72px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -1px;
    }
    .wcln-text .ca { color: #7a7a7a; }
    .wcln-sub {
      font-size: clamp(14px, 1.8vw, 28px);
      color: #555;
      margin-top: 4px;
    }

    .quiz-layout {
      display: grid;
      grid-template-columns: 278px 1fr;
      height: 100%;
    }

    .sidebar {
      background: var(--panel);
      padding: 26px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .sidebar .mini-logo {
      width: 100%;
      margin-top: 4px;
      color: #000;
      transform: scale(0.88);
      transform-origin: top center;
    }

    .face-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .face {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #000;
      background: #f1ab43;
      position: relative;
      flex: 0 0 auto;
    }

    .face::before,
    .face::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #000;
      top: 22px;
    }

    .face::before { left: 18px; }
    .face::after { right: 18px; }

    .face .mouth {
      position: absolute;
      left: 50%;
      bottom: 15px;
      width: 30px;
      height: 16px;
      border: 4px solid #000;
      border-top: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      transform: translateX(-50%);
    }

    .face.bad {
      background: #ef5837;
    }

    .face.bad::before,
    .face.bad::after {
      width: 14px;
      height: 4px;
      border-radius: 0;
      top: 24px;
      background: #000;
    }

    .face.bad::before { left: 15px; transform: rotate(45deg); }
    .face.bad::after { right: 15px; transform: rotate(-45deg); }

    .face.bad .mouth {
      width: 22px;
      height: 12px;
      border: 4px solid #000;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      border-top: 0;
      left: 48%;
    }

    .face.bad .tongue {
      position: absolute;
      width: 12px;
      height: 10px;
      background: #ff9fb0;
      border: 3px solid #000;
      border-top: 0;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      right: 16px;
      bottom: 10px;
      transform: rotate(18deg);
    }

    .progress-wrap {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-top: 6px;
    }

    .progress-label {
      width: 62px;
      height: 268px;
      border: 5px solid #f0f0f0;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #efd7d7;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }

    .progress-bars {
      width: 86px;
      height: 268px;
      display: grid;
      grid-template-rows: repeat(11, 1fr);
      gap: 8px;
    }

    .bar {
      background: #ededed;
      border: 2px solid #d3d3d3;
      border-radius: 1px;
    }

    .bar.done { background: #efbf00; }

    .main {
      position: relative;
      padding: 52px 4.8vw 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .question-box {
      width: min(80vw, 980px);
      min-height: 152px;
      background: rgba(245,245,245,0.95);
      border: 5px solid #4f5569;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 30px;
      margin-top: 18px;
      margin-bottom: 44px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset;
    }

    .equation {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(40px, 4.3vw, 74px);
      text-align: center;
      line-height: 1.12;
      letter-spacing: 0.3px;
    }

    .options {
      width: min(62vw, 740px);
      display: grid;
      gap: 34px;
    }

    .option {
      width: 100%;
      min-height: 96px;
      border-radius: 18px;
      background: rgba(243,243,243,0.96);
      border: 3px solid var(--gold);
      color: #111;
      font-size: clamp(28px, 2.3vw, 42px);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
    }

    .option:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .option:disabled { cursor: default; }
    .option.correct {
      outline: 4px solid rgba(84, 234, 255, 0.45);
      box-shadow: 0 0 24px rgba(84, 234, 255, 0.45);
    }
    .option.incorrect {
      outline: 4px solid rgba(255, 120, 120, 0.38);
      box-shadow: 0 0 22px rgba(255, 120, 120, 0.34);
    }

    .nav-btn {
      position: absolute;
      right: 16px;
      bottom: 14px;
      border: 0;
      cursor: pointer;
      min-width: 182px;
      height: 90px;
      padding: 0 26px;
      font-size: 34px;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--blue);
      clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
      box-shadow: 0 5px 0 rgba(0,0,0,0.14);
    }

    .nav-btn.show { display: flex; }
    .nav-btn.restart {
      position: static;
      display: inline-flex;
      min-width: 210px;
      height: 86px;
      border-radius: 999px;
      clip-path: none;
      background: #4a5068;
      text-transform: lowercase;
      font-size: 30px;
      padding: 0 40px;
    }

    .nav-btn.wrong::before {
      content: "N";
      background: var(--red);
      position: absolute;
      left: -96px;
      top: 0;
      width: 116px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 42px;
      clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    }

    .result-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 44px;
    }

    .result-card {
      width: min(92vw, 1320px);
      min-height: 76vh;
      background: #f3d62d;
      border: 6px solid #4e4e4e;
      border-radius: 52px;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 28px;
      align-items: center;
      padding: 34px 42px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .avatar-card {
      width: 100%;
      aspect-ratio: 1 / 1.28;
      background: #ececec;
      border: 6px solid #4e4e4e;
      border-radius: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .avatar {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 7px solid #7b8088;
      background: #f4b85d;
      position: relative;
      overflow: hidden;
    }

    .avatar .hair {
      position: absolute;
      width: 180px;
      height: 170px;
      background: #efb15a;
      border: 7px solid #815f54;
      border-radius: 90px 90px 78px 78px;
      left: 20px;
      top: 26px;
    }

    .avatar .face-shape {
      position: absolute;
      width: 130px;
      height: 110px;
      background: #f6e3b1;
      border-radius: 60px 60px 50px 50px;
      left: 45px;
      top: 62px;
      box-shadow: 0 32px 0 18px #f6e3b1;
    }

    .avatar .bang {
      position: absolute;
      width: 110px;
      height: 42px;
      border-bottom: 8px solid rgba(243, 187, 86, 0.95);
      border-radius: 0 0 60px 60px;
      left: 55px;
      top: 68px;
      transform: rotate(7deg);
    }

    .avatar .eye,
    .avatar .eye2 {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4e413d;
      top: 116px;
    }
    .avatar .eye { left: 92px; }
    .avatar .eye2 { right: 92px; }

    .avatar .smile {
      position: absolute;
      width: 30px;
      height: 16px;
      border: 4px solid #4e413d;
      border-top: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      left: 50%;
      top: 136px;
      transform: translateX(-50%);
    }

    .avatar .blush,
    .avatar .blush2 {
      position: absolute;
      width: 22px;
      height: 10px;
      background: rgba(237, 153, 164, 0.6);
      border-radius: 999px;
      top: 132px;
    }
    .avatar .blush { left: 70px; }
    .avatar .blush2 { right: 70px; }

    .avatar .ear,
    .avatar .ear2 {
      position: absolute;
      width: 28px;
      height: 38px;
      border-radius: 50%;
      border: 6px solid #815f54;
      background: #f6d6ad;
      top: 125px;
    }
    .avatar .ear { left: 8px; }
    .avatar .ear2 { right: 8px; }

    .avatar .body {
      position: absolute;
      width: 95px;
      height: 70px;
      background: #dfb0a0;
      border-radius: 34px 34px 0 0;
      left: 62px;
      bottom: -10px;
      border: 6px solid rgba(129, 95, 84, 0.45);
    }

    .result-copy {
      padding-right: 10px;
    }

    .result-title {
      color: #ff5e7e;
      font-size: clamp(42px, 4vw, 64px);
      font-weight: 800;
      margin-bottom: 30px;
    }

    .result-line {
      height: 2px;
      background: rgba(73, 73, 73, 0.45);
      margin-bottom: 38px;
      width: 90%;
    }

    .score {
      font-size: clamp(34px, 3vw, 56px);
      color: #37406a;
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 34px;
    }

    .score span {
      color: #fff6cc;
    }

    @media (max-width: 1100px) {
      .quiz-layout { grid-template-columns: 180px 1fr; }
      .sidebar { padding: 18px 10px; }
      .face { width: 48px; height: 48px; border-width: 3px; }
      .face::before, .face::after { top: 14px; width: 6px; height: 6px; }
      .face::before { left: 12px; }
      .face::after { right: 12px; }
      .face .mouth { width: 20px; height: 12px; bottom: 10px; border-width: 3px; }
      .progress-label { height: 210px; width: 48px; font-size: 20px; }
      .progress-bars { height: 210px; width: 56px; }
      .question-box { width: min(88vw, 900px); min-height: 130px; }
      .options { width: min(70vw, 720px); gap: 22px; }
      .option { min-height: 82px; }
      .result-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .result-line { margin-left: auto; margin-right: auto; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="screen start-screen active" id="startScreen">
    <div class="speed-badge">1.00</div>
    <div class="start-wrap">
      <div class="start-inner">
        <div class="title">Reflect &amp;<br />Check for Understanding!</div>
        <button class="start-btn" id="startBtn">Start</button>
        <div class="wcln-logo" aria-hidden="true">
          <div class="wcln-mark">
            <div class="star-person red"></div>
            <div class="star-person white"></div>
            <div class="star-person blue"></div>
            <div class="star-person yellow"></div>
          </div>
          <div class="wcln-text">WCLN<span class="ca">.ca</span></div>
          <div class="wcln-sub">Western Canadian Learning Network</div>
        </div>
      </div>
    </div>
  </div>

  <div class="screen quiz-screen" id="quizScreen">
    <div class="speed-badge">1.00</div>
    <div class="quiz-layout">
      <aside class="sidebar">
        <div class="mini-logo wcln-logo" aria-hidden="true">
          <div class="wcln-mark">
            <div class="star-person red"></div>
            <div class="star-person white"></div>
            <div class="star-person blue"></div>
            <div class="star-person yellow"></div>
          </div>
          <div class="wcln-text">WCLN<span class="ca">.ca</span></div>
        </div>

        <div class="face-row" id="faceRow">
          <div class="face"><div class="mouth"></div></div>
          <div class="face"><div class="mouth"></div></div>
          <div class="face"><div class="mouth"></div></div>
        </div>

        <div class="progress-wrap">
          <div class="progress-label">progress</div>
          <div class="progress-bars" id="progressBars"></div>
        </div>
      </aside>

      <main class="main">
        <div class="question-box">
          <div class="equation" id="equation"></div>
        </div>
        <div class="options" id="options"></div>
        <button class="nav-btn" id="nextBtn">Next</button>
      </main>
    </div>
  </div>

  <div class="screen result-screen" id="resultScreen">
    <div class="speed-badge">1.00</div>
    <div class="result-wrap">
      <div class="result-card">
        <div class="avatar-card">
          <div class="avatar" aria-hidden="true">
            <div class="hair"></div>
            <div class="face-shape"></div>
            <div class="bang"></div>
            <div class="ear"></div>
            <div class="ear2"></div>
            <div class="eye"></div>
            <div class="eye2"></div>
            <div class="blush"></div>
            <div class="blush2"></div>
            <div class="smile"></div>
            <div class="body"></div>
          </div>
        </div>
        <div class="result-copy">
          <div class="result-title">You successfully completed the quiz !</div>
          <div class="result-line"></div>
          <div class="score">
            Correct Answers: <span id="correctCount">0</span><br />
            Wrong Answers: <span id="wrongCount">0</span>
          </div>
          <button class="nav-btn restart" id="restartBtn">restart</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        equation: 'C<sub>4</sub>H<sub>8</sub> + 6O<sub>2</sub> &rarr; 4CO<sub>2</sub> + 4H<sub>2</sub>O',
        options: ['Synthesis', 'Combustion', 'Double Replacement', 'Neutralization'],
        answer: 'Combustion'
      },
      {
        equation: '(NH<sub>4</sub>)<sub>2</sub>CO<sub>3</sub> + Ca(NO<sub>3</sub>)<sub>2</sub> &rarr; 2NH<sub>4</sub>NO<sub>3</sub> + CaCO<sub>3</sub>',
        options: ['Decomposition', 'Synthesis', 'Combustion', 'Double Replacement'],
        answer: 'Double Replacement'
      },
      {
        equation: 'Pb(NO<sub>3</sub>)<sub>2</sub> + 2KI &rarr; PbI<sub>2</sub> + 2KNO<sub>3</sub>',
        options: ['Combustion', 'Synthesis', 'Decomposition', 'Double Replacement'],
        answer: 'Double Replacement'
      },
      {
        equation: '2HF &rarr; H<sub>2</sub> + F<sub>2</sub>',
        options: ['Synthesis', 'Double Replacement', 'Decomposition', 'Single Replacement'],
        answer: 'Decomposition'
      },
      {
        equation: '2Au(NO<sub>3</sub>)<sub>3</sub> + 3Cu &rarr; 2Au + 3Cu(NO<sub>3</sub>)<sub>2</sub>',
        options: ['Double Replacement', 'Synthesis', 'Combustion', 'Single Replacement'],
        answer: 'Single Replacement'
      },
      {
        equation: 'HCl + KOH &rarr; KCl + H<sub>2</sub>O',
        options: ['Synthesis', 'Combustion', 'Neutralization', 'Single Replacement'],
        answer: 'Neutralization'
      },
      {
        equation: 'S<sub>8</sub> + 12O<sub>2</sub> &rarr; 8SO<sub>3</sub>',
        options: ['Decomposition', 'Synthesis', 'Single Replacement', 'Neutralization'],
        answer: 'Synthesis'
      },
      {
        equation: 'Zn + 2HCl &rarr; ZnCl<sub>2</sub> + H<sub>2</sub>',
        options: ['Single Replacement', 'Double Replacement', 'Neutralization', 'Combustion'],
        answer: 'Single Replacement'
      },
      {
        equation: 'N<sub>2</sub> + 3Zn &rarr; Zn<sub>3</sub>N<sub>2</sub>',
        options: ['Synthesis', 'Single Replacement', 'Neutralization', 'Combustion'],
        answer: 'Synthesis'
      },
      {
        equation: 'H<sub>2</sub>SO<sub>4</sub> + 2NaOH &rarr; Na<sub>2</sub>SO<sub>4</sub> + 2H<sub>2</sub>O',
        options: ['Synthesis', 'Neutralization', 'Decomposition', 'Single Replacement'],
        answer: 'Neutralization'
      },
      {
        equation: 'Mg + CuSO<sub>4</sub> &rarr; MgSO<sub>4</sub> + Cu',
        options: ['Combustion', 'Single Replacement', 'Synthesis', 'Neutralization'],
        answer: 'Single Replacement'
      }
    ];

    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const nextBtn = document.getElementById('nextBtn');
    const equationEl = document.getElementById('equation');
    const optionsEl = document.getElementById('options');
    const progressBarsEl = document.getElementById('progressBars');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const faceRow = document.getElementById('faceRow');

    let current = 0;
    let correct = 0;
    let wrong = 0;
    let answered = false;

    function makeBars() {
      progressBarsEl.innerHTML = '';
      for (let i = 0; i < questions.length; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        progressBarsEl.appendChild(bar);
      }
    }

    function updateBars() {
      [...progressBarsEl.children].forEach((bar, index) => {
        bar.classList.toggle('done', index < current);
      });
    }

    function updateFaces(lastWasWrong = false) {
      faceRow.innerHTML = '';
      const badCount = lastWasWrong ? 1 : 0;
      for (let i = 0; i < 3; i++) {
        const face = document.createElement('div');
        face.className = 'face' + (i < badCount ? ' bad' : '');
        const mouth = document.createElement('div');
        mouth.className = 'mouth';
        face.appendChild(mouth);
        if (i < badCount) {
          const tongue = document.createElement('div');
          tongue.className = 'tongue';
          face.appendChild(tongue);
        }
        faceRow.appendChild(face);
      }
    }

    function showScreen(screen) {
      [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function renderQuestion() {
      answered = false;
      nextBtn.className = 'nav-btn';
      nextBtn.textContent = 'Next';
      nextBtn.onclick = goNext;
      equationEl.innerHTML = questions[current].equation;
      optionsEl.innerHTML = '';
      updateBars();
      updateFaces(false);

      questions[current].options.forEach(optionText => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = optionText;
        btn.addEventListener('click', () => handleAnswer(btn, optionText));
        optionsEl.appendChild(btn);
      });
    }

    function handleAnswer(button, selected) {
      if (answered) return;
      answered = true;

      const q = questions[current];
      const buttons = [...optionsEl.querySelectorAll('.option')];
      buttons.forEach(btn => btn.disabled = true);

      if (selected === q.answer) {
        button.classList.add('correct');
        correct++;
        nextBtn.classList.add('show');
        updateFaces(false);
      } else {
        button.classList.add('incorrect');
        const correctButton = buttons.find(btn => btn.textContent === q.answer);
        if (correctButton) correctButton.classList.add('correct');
        wrong++;
        nextBtn.classList.add('show', 'wrong');
        updateFaces(true);
      }
    }

    function goNext() {
      current++;
      if (current >= questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    function finishQuiz() {
      correctCountEl.textContent = correct;
      wrongCountEl.textContent = wrong;
      showScreen(resultScreen);
    }

    function resetQuiz() {
      current = 0;
      correct = 0;
      wrong = 0;
      makeBars();
      renderQuestion();
      showScreen(quizScreen);
    }

    startBtn.addEventListener('click', resetQuiz);
    restartBtn.addEventListener('click', () => showScreen(startScreen));

    makeBars();
  </script>
</body>
</html>
