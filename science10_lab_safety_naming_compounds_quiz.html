          zh: "开始任何科学活动之前，你应该做什么？"
        },
        options: [
          { key: "a", text: { en: "Put on goggles only", zh: "只戴上护目镜" } },
          { key: "b", text: { en: "Read each rule carefully", zh: "认真阅读每一条规则" } },

          { key: "d", text: { en: "Start setting up equipment", zh: "开始摆放器材" } }
        ],
        answerKey: "b",
        explanation: {
          en: "The lesson says safety starts before the activity, and students should read the rules and written instructions first.",
          zh: "课程强调安全从活动开始前就开始了，学生应先阅读安全规则和书面说明。"
        }
      },
      {
        id: "q02",
        topic: { en: "Lab Safety", zh: "实验室安全" },
        prompt: {
          en: "A science experiment should only be done",
          zh: "科学实验只能在什么情况下进行？"
        },
        options: [
          { key: "a", text: { en: "after lunch", zh: "午饭后" } },
          { key: "b", text: { en: "with a partner", zh: "和同伴一起" } },
          { key: "c", text: { en: "with approval and direct adult supervision", zh: "经批准并在成人直接监督下" } },
          { key: "d", text: { en: "in a large room", zh: "在宽敞的房间里" } }

        answerKey: "c",
        explanation: {
          en: "The lesson states that experiments must not be done without approval and direct supervision from a teacher, parent, or guardian.",
          zh: "课程指出，未经老师、家长或监护人批准并直接监督，不能进行实验。"
        }
      },
      {
        id: "q03",
        topic: { en: "Lab Safety", zh: "实验室安全" },
        prompt: {
          en: "If you need to smell a chemical, you should",
          zh: "如果你需要闻一种化学品，你应该怎么做？"

          { key: "b", text: { en: "hold it close to your nose", zh: "把它靠近鼻子" } },

          { key: "d", text: { en: "shake the container first", zh: "先摇晃容器" } }

        answerKey: "c",
        explanation: {
          en: "The correct safety method is wafting, not smelling directly from the container.",
          zh: "正确的安全方法是轻轻扇气味过来，而不是直接对着容器闻。"
        }

      {

          { key: "d", text: { en: "use soap immediately", zh: "立刻用肥皂洗" } }

        answerKey: "b",
        explanation: {
          en: "The lesson specifically says to flush the eyes for 10 minutes and seek medical help as soon as possible.",

      },
      {

          en: "The lesson connects proper disposal to protecting waterways, including salmon-spawning streams.",
          zh: "课程把正确处理化学品与保护水道联系起来，包括保护鲑鱼产卵溪流。"
        }
      },
      {
        id: "q06",
        topic: { en: "Lab Safety", zh: "实验室安全" },

          zh: "要判断一个物体是否烫，你应该怎么做？"

          { key: "d", text: { en: "hold it with bare hands", zh: "直接用手拿起" } }
        ],
        answerKey: "b",

          zh: "课程教授了用手背靠近而不接触来判断热物体的方法。"

      },

        answerKey: "c",

      },
      {

        topic: { en: "Lab Safety", zh: "实验室安全" },

        options: [

          { key: "c", text: { en: "paper towels", zh: "纸巾" } },
          { key: "d", text: { en: "glassware", zh: "玻璃器皿" } }

        answerKey: "b",
        explanation: {

        answerKey: "c",

        options: [
          { key: "a", text: { en: "always", zh: "总是" } },
          { key: "b", text: { en: "only for ionic compounds", zh: "只在离子化合物中" } },
          { key: "c", text: { en: "only at the start of a sentence or in a title", zh: "只在句首或标题中" } },
          { key: "d", text: { en: "only for covalent compounds", zh: "只在共价化合物中" } }
        ],
        answerKey: "c",
        explanation: {
          en: "The lesson includes a note that compound names are not normally capitalized except at the start of a sentence or in a title.",
          zh: "课程特别说明，化合物名称通常不大写，除非位于句首或标题中。"
        }
      },
      {
        id: "q17",
        topic: { en: "Naming Compounds", zh: "化合物命名" },
        prompt: {
          en: "Covalent compounds are made from",
          zh: "共价化合物是由什么组成的？"
        },
        options: [
          { key: "a", text: { en: "metals only", zh: "只有金属" } },
          { key: "b", text: { en: "a metal and a non-metal", zh: "一个金属和一个非金属" } },
          { key: "c", text: { en: "two non-metals", zh: "两个非金属" } },
          { key: "d", text: { en: "ions only", zh: "只有离子" } }
        ],
        answerKey: "c",
        explanation: {
          en: "The lesson distinguishes covalent compounds as combinations of non-metals with non-metals.",
          zh: "课程把共价化合物区分为非金属与非金属的结合。"
        }
      },
      {
        id: "q18",
        topic: { en: "Naming Compounds", zh: "化合物命名" },
        prompt: {
          en: "Which prefix means 3 in covalent naming?",
          zh: "在共价化合物命名中，表示 3 的前缀是哪个？"
        },
        options: [
          { key: "a", text: { en: "mono-", zh: "mono-" } },
          { key: "b", text: { en: "di-", zh: "di-" } },
          { key: "c", text: { en: "tri-", zh: "tri-" } },
          { key: "d", text: { en: "tetra-", zh: "tetra-" } }
        ],
        answerKey: "c",
        explanation: {
          en: "The prefix chart in the lesson lists tri- for 3.",
          zh: "课程中的前缀表列出 3 对应 tri-。"
        }
      },
      {
        id: "q19",
        topic: { en: "Naming Compounds", zh: "化合物命名" },
        prompt: {
          en: "What is the correct name for N2O?",
          zh: "N2O 的正确名称是什么？"
        },
        options: [
          { key: "a", text: { en: "Nitrogen oxide", zh: "Nitrogen oxide" } },
          { key: "b", text: { en: "Dinitrogen monoxide", zh: "Dinitrogen monoxide" } },
          { key: "c", text: { en: "Nitrogen monooxide", zh: "Nitrogen monooxide" } },
          { key: "d", text: { en: "Dioxide nitrogen", zh: "Dioxide nitrogen" } }
        ],
        answerKey: "b",
        explanation: {
          en: "The lesson gives N2O as an example and names it dinitrogen monoxide.",
          zh: "课程把 N2O 作为例子，并给出名称 dinitrogen monoxide。"
        }
      },
      {
        id: "q20",
        topic: { en: "Naming Compounds", zh: "化合物命名" },
        prompt: {
          en: "Why are brackets needed in Ca(OH)2?",
          zh: "为什么 Ca(OH)2 中需要括号？"
        },
        options: [
          { key: "a", text: { en: "To show calcium is negative", zh: "表示 calcium 带负电" } },
          { key: "b", text: { en: "To show OH is a polyatomic group repeated twice", zh: "表示 OH 是重复两次的多原子离子整体" } },
          { key: "c", text: { en: "To separate metals from non-metals", zh: "把金属和非金属分开" } },
          { key: "d", text: { en: "To indicate a covalent bond", zh: "表示共价键" } }
        ],
        answerKey: "b",
        explanation: {
          en: "The lesson notes that OH needs brackets to keep the polyatomic ion together when there are two hydroxide groups.",
          zh: "课程说明，当需要两个 hydroxide 基团时，必须用括号把 OH 这个多原子离子整体括起来。"
        }
      }
    ];

    const state = {
      lang: "bi",
      order: [],
      lastAction: "idle",
      score: null
    };

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function localizedBlock(text) {
      return [
        '<span class="i18n-wrap">',
        '<span class="i18n-en">' + escapeHtml(text.en) + "</span>",
        '<span class="i18n-zh" lang="zh-Hans">' + escapeHtml(text.zh) + "</span>",
        "</span>"
      ].join("");
    }

    function getQuestionById(id) {
      return questions.find((question) => question.id === id);
    }

    function shuffled(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function ensureOrder() {
      if (!state.order.length) {
        state.order = questions.map((question) => question.id);
      }
    }

    function currentSelections() {
      const selections = {};
      state.order.forEach((questionId) => {
        const checked = document.querySelector('input[name="' + questionId + '"]:checked');
        selections[questionId] = checked ? checked.value : "";
      });
      return selections;
    }

    function updateLanguage() {
      document.body.classList.toggle("lang-bi", state.lang === "bi");
      document.body.classList.toggle("lang-zh", state.lang === "zh");
      document.documentElement.lang = state.lang === "zh" ? "zh" : "en";
      document.getElementById("languageMode").value = state.lang;
    }

    function buildOptionMarkup(questionId, option, checked) {
      const inputId = questionId + "_" + option.key;
      return [
        '<label class="option" for="' + inputId + '">',
        '<input type="radio" id="' + inputId + '" name="' + questionId + '" value="' + option.key + '"' + (checked ? " checked" : "") + " />",
        '<span class="option-text">' + localizedBlock(option.text) + "</span>",
        "</label>"
      ].join("");
    }

    function renderQuiz(savedSelections) {
      ensureOrder();
      const list = document.getElementById("quizList");
      list.innerHTML = "";

      state.order.forEach((questionId, index) => {
        const question = getQuestionById(questionId);
        const card = document.createElement("section");
        card.className = "card";
        card.id = "card_" + question.id;

        const options = shuffled(question.options);
        const selected = savedSelections[question.id] || "";

        card.innerHTML = [
          '<div class="question-meta">',
          '<div class="question-number">Question ' + (index + 1) + "</div>",
          '<div class="topic-tag">' + localizedBlock(question.topic) + "</div>",
          "</div>",
          '<p class="prompt">' + localizedBlock(question.prompt) + "</p>",
          '<div class="options">' + options.map((option) => buildOptionMarkup(question.id, option, selected === option.key)).join("") + "</div>",
          '<div class="action-row">',
          '<button type="button" data-action="check" data-question="' + question.id + '">Check This Question</button>',
          "</div>",
          '<div class="feedback" id="feedback_' + question.id + '"></div>'
        ].join("");

        list.appendChild(card);
      });
    }

    function markQuestion(questionId, mode, messageHtml) {
      const card = document.getElementById("card_" + questionId);
      const feedback = document.getElementById("feedback_" + questionId);
      card.classList.remove("correct", "incorrect");
      feedback.className = "feedback show";

      if (mode === "correct") {
        card.classList.add("correct");
        feedback.classList.add("correct");
      } else if (mode === "incorrect") {
        card.classList.add("incorrect");
        feedback.classList.add("incorrect");
      } else {
        feedback.classList.add("unanswered");
      }

      feedback.innerHTML = messageHtml;
    }

    function gradeQuestion(questionId) {
      const question = getQuestionById(questionId);
      const selected = document.querySelector('input[name="' + questionId + '"]:checked');
      const answer = question.options.find((option) => option.key === question.answerKey);

      if (!selected) {
        markQuestion(
          questionId,
          "unanswered",
          '<strong>Not answered.</strong><div class="detail">Correct answer: ' + localizedBlock(answer.text) + "<br>" + localizedBlock(question.explanation) + "</div>"
        );
        return false;
      }

      if (selected.value === question.answerKey) {
        markQuestion(
          questionId,
          "correct",
          '<strong>Correct.</strong><div class="detail">' + localizedBlock(question.explanation) + "</div>"
        );
        return true;
      }

      markQuestion(
        questionId,
        "incorrect",
        '<strong>Incorrect.</strong><div class="detail">Correct answer: ' + localizedBlock(answer.text) + "<br>" + localizedBlock(question.explanation) + "</div>"
      );
      return false;
    }

    function updateScoreBox() {
      const box = document.getElementById("scoreBox");
      if (state.lastAction === "graded" && state.score) {
        box.textContent = "Score: " + state.score.correct + "/" + state.score.total + " (" + state.score.percent + "%)";
        return;
      }
      if (state.lastAction === "answers") {
        box.textContent = "Answers shown";
        return;
      }
      box.textContent = "Not graded";
    }

    function updateSummary(correct, total, shownAnswers) {
      const summary = document.getElementById("summary");
      const text = document.getElementById("summaryText");
      summary.style.display = "block";

      if (shownAnswers) {
        text.textContent = "All answers are now visible. Reset or shuffle if you want another practice round.";
        return;
      }

      const percent = Math.round((correct / total) * 100);
      if (percent >= 90) {
        text.textContent = "Strong result. You have a solid grasp of the safety rules and naming patterns in these two lessons.";
      } else if (percent >= 75) {
        text.textContent = "Good result. Review the missed questions, especially symbol meanings, Roman numerals, and polyatomic ion notation.";
      } else if (percent >= 60) {
        text.textContent = "Partial understanding. Re-read the lessons and focus on safety response steps and the naming rules for ionic versus covalent compounds.";
      } else {
        text.textContent = "This set needs another pass. Review the source lessons, then reset and try again.";
      }
    }

    function gradeAll() {
      let correct = 0;
      state.order.forEach((questionId) => {
        if (gradeQuestion(questionId)) {
          correct += 1;
        }
      });

      state.score = {
        correct: correct,
        total: state.order.length,
        percent: Math.round((correct / state.order.length) * 100)
      };
      state.lastAction = "graded";
      updateScoreBox();
      updateSummary(correct, state.order.length, false);
    }

    function showAnswers() {
      state.order.forEach((questionId) => {
        const question = getQuestionById(questionId);
        const correctInput = document.querySelector('input[name="' + questionId + '"][value="' + question.answerKey + '"]');
        if (correctInput) {
          correctInput.checked = true;
        }
        gradeQuestion(questionId);
      });

      state.lastAction = "answers";
      state.score = null;
      updateScoreBox();
      updateSummary(0, state.order.length, true);
    }

    function resetQuiz() {
      state.lastAction = "idle";
      state.score = null;
      renderQuiz({});
      updateLanguage();
      updateScoreBox();
      document.getElementById("summary").style.display = "none";
      document.getElementById("summaryText").textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function shuffleQuestions() {
      const selections = currentSelections();
      state.order = shuffled(state.order);
      state.lastAction = "idle";
      state.score = null;
      renderQuiz(selections);
      updateLanguage();
      updateScoreBox();
      document.getElementById("summary").style.display = "none";
      document.getElementById("summaryText").textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("quizList").addEventListener("click", (event) => {
      const button = event.target.closest('button[data-action="check"]');
      if (!button) {
        return;
      }
      gradeQuestion(button.dataset.question);
    });

    document.getElementById("gradeAllBtn").addEventListener("click", gradeAll);
    document.getElementById("resetBtn").addEventListener("click", resetQuiz);
    document.getElementById("showAnswersBtn").addEventListener("click", showAnswers);
    document.getElementById("shuffleBtn").addEventListener("click", shuffleQuestions);
    document.getElementById("languageMode").addEventListener("change", (event) => {
      state.lang = event.target.value;
      updateLanguage();
    });

    ensureOrder();
    renderQuiz({});
    updateLanguage();
    updateScoreBox();
  </script>
</body>
</html>
